name: E2E Tests

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'e2e-tests/**'
      - '.github/workflows/e2e-tests.yml'
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to test'
        required: false
        default: 'chromium'
        type: choice
        options:
          - chromium
          - firefox
          - webkit
          - all

jobs:
  e2e-tests:
    name: E2E Tests - ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium]
        # Uncomment to test all browsers
        # browser: [chromium, firefox, webkit]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Cache Playwright browsers
        uses: actions/cache@v3
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright pytest pytest-playwright pytest-html pytest-xdist allure-pytest
      
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps ${{ matrix.browser }}
      
      - name: Install Playwright browser dependencies only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: python -m playwright install-deps ${{ matrix.browser }}
      
      - name: Setup Node.js (for backend)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci
      
      - name: Setup test database
        run: |
          docker-compose -f docker-compose.test.yml up -d postgres redis
          sleep 5
      
      - name: Run database migrations
        working-directory: ./backend
        run: npm run migrate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/neobank_test
      
      - name: Start backend server
        working-directory: ./backend
        run: |
          npm run start:test &
          echo $! > backend.pid
          sleep 10
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test:test@localhost:5432/neobank_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-key-for-ci
      
      - name: Setup frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build
      
      - name: Start frontend server
        working-directory: ./frontend
        run: |
          npm run start &
          echo $! > frontend.pid
          sleep 10
        env:
          NODE_ENV: test
          REACT_APP_API_URL: http://localhost:8000
      
      - name: Wait for services to be ready
        run: |
          timeout 60 bash -c 'until curl -f http://localhost:8000/health; do sleep 2; done'
          timeout 60 bash -c 'until curl -f http://localhost:3000; do sleep 2; done'
      
      - name: Run E2E tests
        working-directory: ./e2e-tests
        run: |
          pytest -v \
            --browser=${{ matrix.browser }} \
            --html=reports/test_report_${{ matrix.browser }}.html \
            --self-contained-html \
            --junitxml=reports/junit_${{ matrix.browser }}.xml \
            --alluredir=reports/allure-results \
            -n 4
        env:
          BASE_URL: http://localhost:3000
          API_BASE_URL: http://localhost:8000
          TEST_USER_EMAIL: test.user@neobank.com
          TEST_USER_PASSWORD: TestPassword123!
          PWDEBUG: 0
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.browser }}
          path: |
            e2e-tests/reports/
            e2e-tests/screenshots/
            e2e-tests/videos/
            e2e-tests/traces/
          retention-days: 30
      
      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-${{ matrix.browser }}
          path: e2e-tests/reports/allure-results
          retention-days: 30
      
      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: e2e-tests/reports/junit_*.xml
          check_name: E2E Test Results (${{ matrix.browser }})
      
      - name: Comment PR with test results
        uses: daun/playwright-report-comment@v3
        if: always() && github.event_name == 'pull_request'
        with:
          report-path: e2e-tests/reports/test_report_${{ matrix.browser }}.html
      
      - name: Stop services
        if: always()
        run: |
          if [ -f backend/backend.pid ]; then
            kill $(cat backend/backend.pid) || true
          fi
          if [ -f frontend/frontend.pid ]; then
            kill $(cat frontend/frontend.pid) || true
          fi
          docker-compose -f docker-compose.test.yml down
      
      - name: Cleanup
        if: always()
        run: |
          rm -rf e2e-tests/screenshots/*
          rm -rf e2e-tests/videos/*
          rm -rf e2e-tests/traces/*

  generate-allure-report:
    name: Generate Allure Report
    runs-on: ubuntu-latest
    needs: e2e-tests
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download all Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true
      
      - name: Generate Allure report
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: allure-results
          allure_history: allure-history
          keep_reports: 20
      
      - name: Deploy Allure report to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-history
          destination_dir: allure-report

  notify-slack:
    name: Notify Slack
    runs-on: ubuntu-latest
    needs: e2e-tests
    if: always() && github.event_name == 'pull_request'
    
    steps:
      - name: Send Slack notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ needs.e2e-tests.result }}
          text: |
            E2E Tests ${{ needs.e2e-tests.result }}
            PR: ${{ github.event.pull_request.title }}
            Author: ${{ github.event.pull_request.user.login }}
            URL: ${{ github.event.pull_request.html_url }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
