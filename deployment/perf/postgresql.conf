# PostgreSQL 16 — NeoBank OLTP tuning (target: p95 < 10ms point queries)
# Baseline: 8 vCPU / 32GB RAM / NVMe. Scale proportionally.

# --- Connections ---
max_connections = 400               # app pool (20+30) x N replicas; PgBouncer in front
superuser_reserved_connections = 8

# --- Memory ---
shared_buffers = 8GB                # 25% RAM
effective_cache_size = 24GB         # ~75% RAM
work_mem = 32MB                     # per-sort; watch for blowup with many connections
maintenance_work_mem = 1GB
huge_pages = try

# --- WAL / durability vs latency ---
wal_level = replica
synchronous_commit = off            # banking ledger writes go to TigerBeetle; PG holds
                                    # operational data — accept ~1s loss window for 10x write tps
                                    # (flip to 'remote_apply' for strict durability)
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
max_wal_size = 8GB
min_wal_size = 2GB

# --- Planner (OLTP) ---
random_page_cost = 1.1              # NVMe
effective_io_concurrency = 256
jit = off                           # JIT adds 50-200ms to short queries — off for OLTP
default_statistics_target = 100

# --- Parallelism ---
max_worker_processes = 8
max_parallel_workers_per_gather = 2
max_parallel_workers = 8
max_parallel_maintenance_workers = 4

# --- Autovacuum (hot tables: transactions, idempotency_log) ---
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_max_workers = 4

# --- Logging (perf observability) ---
log_min_duration_statement = 100    # log queries > 100ms
log_checkpoints = on
log_lock_waits = on
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
