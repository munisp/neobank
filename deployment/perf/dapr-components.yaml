# Dapr components — tuned for latency
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
spec:
  type: state.redis
  version: v1
  metadata:
  - name: redisHost
    value: redis-master:6379
  - name: redisPassword
    secretKeyRef: { name: redis, key: password }
  - name: actorStateStore
    value: "false"
  - name: maxRetries
    value: "2"              # fail fast; caller has circuit breaker
  - name: maxRetryBackoff
    value: "200ms"
  - name: ttlInSeconds
    value: "3600"
---
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: pubsub
spec:
  type: pubsub.kafka
  version: v1
  metadata:
  - name: brokers
    value: kafka-0.kafka-headless:9092,kafka-1.kafka-headless:9092
  - name: consumerGroup
    value: neobank-dapr
  - name: disableTls
    value: "true"
  - name: maxMessageBytes
    value: "1048576"
  - name: consumeRetryInterval
    value: "500ms"
---
# Sidecar resource limits (inject via annotations on deployments):
#   dapr.io/sidecar-cpu-limit: "500m"
#   dapr.io/sidecar-memory-limit: "256Mi"
#   dapr.io/sidecar-cpu-request: "50m"
#   dapr.io/config: "tracing-off-in-hot-path"  (sample 1% not 100%)
