# Redis 7.2 — NeoBank tuning (sessions, rate limits, response cache, queues)
maxmemory 4gb
maxmemory-policy allkeys-lru        # evict cache keys first; persistent state uses
                                    # explicit no-evict DB index separation
maxmemory-samples 10

# Persistence: rate limiter + cache can rebuild; session store uses AOF
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite yes
save ""                             # RDB off — AOF only

# Latency
tcp-backlog 1024
timeout 0
tcp-keepalive 60
hz 100                              # more frequent expiry of rate-limit windows
activedefrag yes
active-defrag-cycle-min 10

# I/O threads (4+ vCPU)
io-threads 4
io-threads-do-reads yes

# Safety
latency-monitor-threshold 20
slowlog-log-slower-than 5000        # 5ms
