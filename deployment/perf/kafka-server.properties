# Kafka 3.7 (KRaft) — NeoBank event backbone tuning
# Target: p99 produce latency < 20ms in-region, >1M msg/min cluster

num.network.threads=8
num.io.threads=16
socket.send.buffer.bytes=1048576
socket.receive.buffer.bytes=1048576
socket.request.max.bytes=104857600

# Batching — banking events favour low latency over max throughput
linger.ms=5
batch.size=65536
compression.type=lz4
max.in.flight.requests.per.connection=5   # keep ordering with retries
acks=all
min.insync.replicas=2
unclean.leader.election.enable=false

# Log retention/flush — rely on replication, not fsync, for durability
log.flush.interval.messages=10000
log.flush.interval.ms=1000
log.retention.hours=168
log.segment.bytes=1073741824

# Replication
num.replica.fetchers=4
replica.lag.time.max.ms=10000

# Hot topics (created by provisioning):
#   transactions.events      partitions=24  rf=3
#   fraud.scores             partitions=12  rf=3
#   notifications.outbound   partitions=12  rf=3
#   lakehouse.ingest         partitions=24  rf=3
