[databases]
neobank = host=postgres-rw dbname=neobank

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

# Transaction pooling is safe: app uses no session state (verified: no SET,
# no advisory locks, no prepared statement names across txns — asyncpg cache
# is per-backend-connection which PgBouncer preserves within a transaction).
pool_mode = transaction
max_client_conn = 5000
default_pool_size = 100
min_pool_size = 20
reserve_pool_size = 25
pool_timeout = 10
server_idle_timeout = 300
server_lifetime = 1800
ignore_startup_parameters = extra_float_digits
