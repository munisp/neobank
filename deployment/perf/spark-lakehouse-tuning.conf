# Spark on lakehouse (Iceberg + MinIO) — ETL/ML feature pipeline tuning
spark.sql.catalog.iceberg=org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.iceberg.type=rest
spark.sql.catalog.iceberg.uri=http://iceberg-rest:8181
spark.sql.catalog.iceberg.warehouse=s3://lakehouse/

# Adaptive execution — the single biggest win for mixed-size ETL
spark.sql.adaptive.enabled=true
spark.sql.adaptive.coalescePartitions.enabled=true
spark.sql.adaptive.skewJoin.enabled=true

# Shuffle
spark.sql.shuffle.partitions=200
spark.serializer=org.apache.spark.serializer.KryoSerializer

# Iceberg writes
spark.sql.iceberg.planning.preserve-data-grouping=true
spark.sql.iceberg.commit.retry.num-retries=5

# Parquet
spark.sql.parquet.compression.codec=zstd
spark.sql.parquet.mergeSchema=false

# Executor sizing (4 workers x 4c/8g)
spark.executor.instances=4
spark.executor.cores=4
spark.executor.memory=6g
spark.executor.memoryOverhead=1g
