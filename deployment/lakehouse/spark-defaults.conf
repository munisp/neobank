# Spark Configuration for NeoBank Lakehouse
# Optimized for Iceberg table access and ML workloads

# Iceberg Configuration
spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.neobank=org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.neobank.type=rest
spark.sql.catalog.neobank.uri=http://iceberg-rest:8181
spark.sql.catalog.neobank.warehouse=s3://neobank-lakehouse
spark.sql.catalog.neobank.io-impl=org.apache.iceberg.aws.s3.S3FileIO
spark.sql.defaultCatalog=neobank

# S3 Configuration
spark.hadoop.fs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.path.style.access=true
spark.hadoop.fs.s3a.connection.ssl.enabled=true
spark.hadoop.fs.s3a.fast.upload=true
spark.hadoop.fs.s3a.multipart.size=104857600

# Performance Tuning
spark.sql.adaptive.enabled=true
spark.sql.adaptive.coalescePartitions.enabled=true
spark.sql.adaptive.skewJoin.enabled=true
spark.sql.shuffle.partitions=200
spark.default.parallelism=100

# Memory Configuration
spark.driver.memory=4g
spark.executor.memory=4g
spark.executor.cores=2
spark.memory.fraction=0.8
spark.memory.storageFraction=0.3

# Iceberg-specific optimizations
spark.sql.iceberg.handle-timestamp-without-timezone=true
spark.sql.sources.partitionOverwriteMode=dynamic

# Compression
spark.sql.parquet.compression.codec=zstd

# Serialization
spark.serializer=org.apache.spark.serializer.KryoSerializer
spark.kryoserializer.buffer.max=1024m

# History Server
spark.eventLog.enabled=true
spark.eventLog.dir=/opt/bitnami/spark/data/spark-events
spark.history.fs.logDirectory=/opt/bitnami/spark/data/spark-events
