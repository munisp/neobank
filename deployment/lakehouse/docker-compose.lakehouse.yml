version: '3.8'

services:
  # Trino Query Engine for SQL analytics
  trino:
    image: trinodb/trino:435
    container_name: neobank-trino
    ports:
      - "8080:8080"
    volumes:
      - ./trino-catalog.properties:/etc/trino/catalog/iceberg.properties:ro
      - ./trino-config.properties:/etc/trino/config.properties:ro
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - ICEBERG_CATALOG_URI=${ICEBERG_CATALOG_URI:-http://iceberg-rest:8181}
      - ICEBERG_WAREHOUSE=${ICEBERG_WAREHOUSE:-s3://neobank-lakehouse}
    depends_on:
      - iceberg-rest
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/info"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - neobank-network

  # Apache Spark for batch processing and ML
  spark-master:
    image: bitnami/spark:3.5
    container_name: neobank-spark-master
    ports:
      - "7077:7077"
      - "8081:8080"
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_HOST=spark-master
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8080
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    volumes:
      - ./spark-defaults.conf:/opt/bitnami/spark/conf/spark-defaults.conf:ro
      - spark-data:/opt/bitnami/spark/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - neobank-network

  spark-worker:
    image: bitnami/spark:3.5
    container_name: neobank-spark-worker
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=4G
      - SPARK_WORKER_CORES=2
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    volumes:
      - ./spark-defaults.conf:/opt/bitnami/spark/conf/spark-defaults.conf:ro
      - spark-data:/opt/bitnami/spark/data
    depends_on:
      - spark-master
    restart: unless-stopped
    networks:
      - neobank-network

  # Iceberg REST Catalog
  iceberg-rest:
    image: tabulario/iceberg-rest:0.10.0
    container_name: neobank-iceberg-rest
    ports:
      - "8181:8181"
    environment:
      - CATALOG_WAREHOUSE=${ICEBERG_WAREHOUSE:-s3://neobank-lakehouse}
      - CATALOG_IO__IMPL=org.apache.iceberg.aws.s3.S3FileIO
      - CATALOG_S3_ENDPOINT=${S3_ENDPOINT:-https://s3.amazonaws.com}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-us-east-1}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8181/v1/config"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - neobank-network

  # RustFS for S3-compatible object storage (replaces MinIO)
  # 2.3x faster than MinIO for small objects, Apache 2.0 licensed
  rustfs:
    image: rustfs/rustfs:latest
    container_name: neobank-rustfs
    ports:
      - "9000:9000"  # S3 API port
      - "9001:9001"  # Console port
    environment:
      - RUSTFS_VOLUMES=/data/rustfs{0..3}
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_EXTERNAL_ADDRESS=:9000
      - RUSTFS_CORS_ALLOWED_ORIGINS=*
      - RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS=*
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY:-rustfsadmin}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY:-rustfsadmin}
      - RUSTFS_OBS_LOGGER_LEVEL=${RUSTFS_LOG_LEVEL:-info}
      - RUSTFS_REGION=${AWS_REGION:-us-east-1}
    volumes:
      - rustfs-data:/data
      - rustfs-logs:/logs
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:9000/health && curl -f http://localhost:9001/rustfs/console/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    networks:
      - neobank-network
    # RustFS runs as non-root user (UID 10001)
    # Ensure data directories are owned by 10001:10001

volumes:
  spark-data:
  rustfs-data:
  rustfs-logs:

networks:
  neobank-network:
    external: true
