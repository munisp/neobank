# Trino Iceberg Catalog Configuration for NeoBank Lakehouse
# This enables SQL queries against the Iceberg tables

connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=${ICEBERG_CATALOG_URI:http://localhost:8181}
iceberg.rest-catalog.warehouse=${ICEBERG_WAREHOUSE:s3://neobank-lakehouse}

# S3 Configuration
hive.s3.aws-access-key=${AWS_ACCESS_KEY_ID}
hive.s3.aws-secret-key=${AWS_SECRET_ACCESS_KEY}
hive.s3.endpoint=${S3_ENDPOINT:s3.amazonaws.com}
hive.s3.path-style-access=true
hive.s3.ssl.enabled=true

# Performance tuning
iceberg.max-partitions-per-writer=100
iceberg.target-max-file-size=128MB
iceberg.compression-codec=ZSTD

# Metadata caching
iceberg.metadata.cache-ttl=5m
iceberg.metadata.cache-size=1000
