# Trino Server Configuration for NeoBank Lakehouse

coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080

# Memory Configuration
query.max-memory=4GB
query.max-memory-per-node=2GB
query.max-total-memory-per-node=3GB

# Performance Tuning
task.concurrency=8
task.max-worker-threads=16
task.min-drivers=8

# Query Execution
query.execution-policy=phased
query.low-memory-killer.policy=total-reservation-on-blocked-nodes

# Spill to disk for large queries
spill-enabled=true
spiller-spill-path=/tmp/trino-spill
spiller-max-used-space-threshold=0.9

# Fault tolerance
retry-policy=TASK
task-retry-attempts-per-task=2
