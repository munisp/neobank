version: '3.8'

services:
  # ===== Backend API =====
  backend:
    build:
      context: ../../NEOBANK-UNIFIED-COMPLETE-FINAL/backend
      dockerfile: Dockerfile
    container_name: neobank-backend
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - API_KEY=${API_KEY}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMS_API_KEY=${SMS_API_KEY}
      - PAYMENT_GATEWAY_KEY=${PAYMENT_GATEWAY_KEY}
      - CORS_ORIGIN=${CORS_ORIGIN}
    depends_on:
      - postgres
      - redis
    networks:
      - neobank-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ===== Frontend Web =====
  frontend:
    build:
      context: ../../NEOBANK-UNIFIED-COMPLETE-FINAL/frontend
      dockerfile: Dockerfile
    container_name: neobank-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${API_URL}
      - NEXT_PUBLIC_APP_URL=${APP_URL}
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - neobank-network
    restart: unless-stopped

  # ===== PWA =====
  pwa:
    build:
      context: ../../NEOBANK-UNIFIED-COMPLETE-FINAL/mobile-pwa
      dockerfile: Dockerfile
    container_name: neobank-pwa
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=${API_URL}
      - VITE_APP_URL=${PWA_URL}
    depends_on:
      - backend
    networks:
      - neobank-network
    restart: unless-stopped

  # ===== KYC/KYB Frontend =====
  kyc-frontend:
    build:
      context: ../../NEOBANK-UNIFIED-COMPLETE-FINAL/kyc-kyb-frontend
      dockerfile: Dockerfile
    container_name: neobank-kyc-frontend
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${API_URL}
      - NEXT_PUBLIC_APP_URL=${KYC_APP_URL}
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - neobank-network
    restart: unless-stopped

  # ===== PostgreSQL Database =====
  postgres:
    image: postgres:15-alpine
    container_name: neobank-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-neobank}
      - POSTGRES_USER=${POSTGRES_USER:-neobank}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - neobank-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-neobank}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== Redis Cache =====
  redis:
    image: redis:7-alpine
    container_name: neobank-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks:
      - neobank-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== Nginx Reverse Proxy =====
  nginx:
    image: nginx:alpine
    container_name: neobank-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    depends_on:
      - backend
      - frontend
      - pwa
      - kyc-frontend
    networks:
      - neobank-network
    restart: unless-stopped

  # ===== Prometheus Monitoring =====
  prometheus:
    image: prom/prometheus:latest
    container_name: neobank-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - neobank-network
    restart: unless-stopped

  # ===== Grafana Dashboard =====
  grafana:
    image: grafana/grafana:latest
    container_name: neobank-grafana
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - neobank-network
    restart: unless-stopped

  # ===== Alertmanager =====
  alertmanager:
    image: prom/alertmanager:latest
    container_name: neobank-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - neobank-network
    restart: unless-stopped

  # ===== Node Exporter (for host metrics) =====
  node-exporter:
    image: prom/node-exporter:latest
    container_name: neobank-node-exporter
    ports:
      - "9100:9100"
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - neobank-network
    restart: unless-stopped

  # ===== Loki (Log Aggregation) =====
  loki:
    image: grafana/loki:latest
    container_name: neobank-loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - neobank-network
    restart: unless-stopped

  # ===== Promtail (Log Shipper) =====
  promtail:
    image: grafana/promtail:latest
    container_name: neobank-promtail
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - neobank-network
    restart: unless-stopped

networks:
  neobank-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
  alertmanager-data:
  loki-data:
