# Transaction Requests Service
transaction-requests-service:
  enabled: true
  
  config:
    kafka:
      producer:
        broker:
          list: mojaloop-kafka:9092
      consumer:
        broker:
          list: mojaloop-kafka:9092
  
  replicaCount: 2

# Simulator for testing
simulator:
  enabled: false

# Mojaloop Testing Toolkit
mojaloop-testing-toolkit:
  enabled: false

# Thirdparty services (disabled by default)
thirdparty:
  enabled: false

# MySQL disabled - using PostgreSQL
mysql:
  enabled: false

# Kafka configuration
kafka:
  enabled: true
  
  replicaCount: 3
  
  persistence:
    enabled: true
    size: 20Gi
  
  zookeeper:
    replicaCount: 3
    persistence:
      enabled: true
      size: 10Gi
  
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "1"

# Redis for caching
redis:
  enabled: true
  
  architecture: replication
  
  master:
    persistence:
      enabled: true
      size: 5Gi
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "500m"
  
  replica:
    replicaCount: 2
    persistence:
      enabled: true
      size: 5Gi
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "500m"
  
  sentinel:
    enabled: true
    masterSet: mojaloop-master
    quorum: 2
