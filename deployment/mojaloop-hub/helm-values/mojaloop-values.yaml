# Mojaloop Hub Helm Values - PostgreSQL Configuration
# This configuration uses PostgreSQL instead of MySQL for all Mojaloop services
# while maintaining compatibility with future Mojaloop updates

global:
  config:
    forensicloggingsidecar_disabled: true
  
  kafka:
    host: mojaloop-kafka
    port: 9092

# Central Ledger - Main transfer state machine
central-ledger:
  enabled: true
  
  centralledger-service:
    config:
      db:
        type: postgres
        driver: pg
        host: mojaloop-postgres-pooler-rw.mojaloop.svc.cluster.local
        port: 5432
        user: mojaloop
        database: central_ledger
        acquireTimeoutMillis: 30000
        createTimeoutMillis: 30000
        destroyTimeoutMillis: 5000
        idleTimeoutMillis: 30000
        reapIntervalMillis: 1000
        createRetryIntervalMillis: 200
        pool:
          min: 10
          max: 30
      
      kafka:
        producer:
          broker:
            list: mojaloop-kafka:9092
        consumer:
          broker:
            list: mojaloop-kafka:9092
    
    env:
      CLEDG_DATABASE__DIALECT: postgres
      CLEDG_DATABASE__HOST: mojaloop-postgres-pooler-rw.mojaloop.svc.cluster.local
      CLEDG_DATABASE__PORT: "5432"
      CLEDG_DATABASE__USER: mojaloop
      CLEDG_DATABASE__DATABASE: central_ledger
    
    secrets:
      CLEDG_DATABASE__PASSWORD:
        secretName: mojaloop-postgres-credentials
        secretKey: password
    
    resources:
      requests:
        memory: "512Mi"
        cpu: "250m"
      limits:
        memory: "1Gi"
        cpu: "1"
    
    replicaCount: 2
    
    readinessProbe:
      enabled: true
      httpGet:
        path: /health
        port: 3001
      initialDelaySeconds: 30
      periodSeconds: 10
    
    livenessProbe:
      enabled: true
      httpGet:
        path: /health
        port: 3001
      initialDelaySeconds: 60
      periodSeconds: 30
  
  centralledger-handler-transfer-prepare:
    config:
      db:
        type: postgres
        driver: pg
        host: mojaloop-postgres-pooler-rw.mojaloop.svc.cluster.local
        port: 5432
        user: mojaloop
        database: central_ledger
    
    env:
      CLEDG_DATABASE__DIALECT: postgres
      CLEDG_DATABASE__HOST: mojaloop-postgres-pooler-rw.mojaloop.svc.cluster.local
    
    secrets:
      CLEDG_DATABASE__PASSWORD:
        secretName: mojaloop-postgres-credentials
        secretKey: password
    
    replicaCount: 2
  
  centralledger-handler-transfer-position:
    config:
      db:
        type: postgres
        driver: pg
        host: mojaloop-postgres-pooler-rw.mojaloop.svc.cluster.local
        port: 5432
        user: mojaloop
        database: central_ledger
    
    env:
      CLEDG_DATABASE__DIALECT: postgres
      CLEDG_DATABASE__HOST: mojaloop-postgres-pooler-rw.mojaloop.svc.cluster.local
    
    secrets:
      CLEDG_DATABASE__PASSWORD:
        secretName: mojaloop-postgres-credentials
        secretKey: password
    
    replicaCount: 2
  
  centralledger-handler-transfer-fulfil:
    config:
      db:
        type: postgres
        driver: pg
        host: mojaloop-postgres-pooler-rw.mojaloop.svc.cluster.local
        port: 5432
        user: mojaloop
        database: central_ledger
    
    env:
      CLEDG_DATABASE__DIALECT: postgres
      CLEDG_DATABASE__HOST: mojaloop-postgres-pooler-rw.mojaloop.svc.cluster.local
    
    secrets:
      CLEDG_DATABASE__PASSWORD:
        secretName: mojaloop-postgres-credentials
        secretKey: password
    
    replicaCount: 2
  
  centralledger-handler-timeout:
    config:
      db:
        type: postgres
        driver: pg
        host: mojaloop-postgres-pooler-rw.mojaloop.svc.cluster.local
        port: 5432
        user: mojaloop
        database: central_ledger
    
    env:
      CLEDG_DATABASE__DIALECT: postgres
      CLEDG_DATABASE__HOST: mojaloop-postgres-pooler-rw.mojaloop.svc.cluster.local
    
    secrets:
      CLEDG_DATABASE__PASSWORD:
        secretName: mojaloop-postgres-credentials
        secretKey: password
    
    replicaCount: 1
  
  centralledger-handler-admin-transfer:
    config:
      db:
        type: postgres
        driver: pg
        host: mojaloop-postgres-pooler-rw.mojaloop.svc.cluster.local
        port: 5432
        user: mojaloop
        database: central_ledger
    
    env:
      CLEDG_DATABASE__DIALECT: postgres
      CLEDG_DATABASE__HOST: mojaloop-postgres-pooler-rw.mojaloop.svc.cluster.local
    
    secrets:
      CLEDG_DATABASE__PASSWORD:
        secretName: mojaloop-postgres-credentials
        secretKey: password
    
    replicaCount: 1

