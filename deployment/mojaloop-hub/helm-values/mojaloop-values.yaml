      ALS_DATABASE__DIALECT: postgres
      ALS_DATABASE__HOST: mojaloop-postgres-pooler-rw.mojaloop.svc.cluster.local
      ALS_DATABASE__PORT: "5432"
      ALS_DATABASE__USER: mojaloop
      ALS_DATABASE__DATABASE: account_lookup
    
    secrets:
      ALS_DATABASE__PASSWORD:
        secretName: mojaloop-postgres-credentials
        secretKey: password
    
