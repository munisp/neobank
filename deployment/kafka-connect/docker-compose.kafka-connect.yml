version: '3.8'

services:
  kafka-connect:
    image: debezium/connect:2.4
    container_name: neobank-kafka-connect
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: ${KAFKA_BROKERS:-kafka:9092}
      GROUP_ID: neobank-connect-cluster
      CONFIG_STORAGE_TOPIC: neobank-connect-configs
      OFFSET_STORAGE_TOPIC: neobank-connect-offsets
      STATUS_STORAGE_TOPIC: neobank-connect-status
      CONFIG_STORAGE_REPLICATION_FACTOR: 3
      OFFSET_STORAGE_REPLICATION_FACTOR: 3
      STATUS_STORAGE_REPLICATION_FACTOR: 3
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_PLUGIN_PATH: /kafka/connect,/usr/share/java
      HEAP_OPTS: "-Xms512M -Xmx2G"
    volumes:
      - ./debezium-postgres-connector.json:/kafka/connect/debezium-postgres-connector.json:ro
    depends_on:
      - kafka
      - postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/connectors"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - neobank-network

  kafka-connect-ui:
    image: landoop/kafka-connect-ui:0.9.7
    container_name: neobank-kafka-connect-ui
    ports:
      - "8084:8000"
    environment:
      CONNECT_URL: http://kafka-connect:8083
    depends_on:
      - kafka-connect
    restart: unless-stopped
    networks:
      - neobank-network

networks:
  neobank-network:
    external: true
