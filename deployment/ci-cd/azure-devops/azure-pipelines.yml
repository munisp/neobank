# azure-pipelines.yml

# Variables for the pipeline
variables:
  # Azure Container Registry (ACR) details
  acrServiceConnection: 'azure-acr-service-connection' # Name of the Azure Resource Manager service connection to ACR
  acrName: 'mycontainerregistry' # Your ACR name
  imageRepository: 'my-app' # Name of the image repository in ACR
  tag: '$(Build.BuildId)' # Image tag will be the Build ID

  # Azure Kubernetes Service (AKS) details
  aksServiceConnection: 'azure-aks-service-connection' # Name of the Kubernetes service connection to AKS
  kubernetesNamespace: 'default' # Namespace for deployment
  imagePullSecret: 'acr-secret' # Name of the secret for AKS to pull images from ACR

  # Application details
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  helmChartPath: '$(Build.SourcesDirectory)/helm/my-app' # Path to your Helm chart

# Global trigger
trigger:
  branches:
    include:
      - main
      - feature/*

# Pool to run the jobs
pool:
  vmImage: 'ubuntu-latest'

# ==============================================================================
# STAGE 1: BUILD
# ==============================================================================
stages:
- stage: Build
  displayName: Build and Push Image
  jobs:
  - job: Build
    displayName: Build, Test, Scan, and Push
    steps:
    
    # 1. Cache Optimization (for dependencies like npm, pip, etc.)
    - task: Cache@2
      displayName: Cache Dependencies
      inputs:
        key: 'npm | "$(Agent.OS)" | package-lock.json' # Adjust key based on your dependency manager
        path: '$(Pipeline.Workspace)/.npm' # Adjust path
        cacheHitVar: 'CACHE_RESTORED'
      # Example of using cache:
      # - script: npm install
      #   displayName: Install dependencies
      #   condition: ne(variables.CACHE_RESTORED, 'true')

    # 2. Automated Testing (Example: using a generic script to run tests)
    - script: |
        echo "Installing test dependencies..."
        # Example: npm install --prefix $(Build.SourcesDirectory)/src/app
        echo "Running unit tests..."
        # Example: npm test --prefix $(Build.SourcesDirectory)/src/app
        echo "Tests completed successfully."
      displayName: Run Automated Tests
      # Continue only if tests pass
      continueOnError: false

    # 3. Security Scanning (Example: Using a generic task for static analysis/vulnerability scanning)
    # NOTE: For production-ready, use a dedicated tool like Snyk, Trivy, or GitHub Advanced Security.
    - task: CmdLine@2
      displayName: Run Security Scan (SAST/Vulnerability)
      inputs:
        script: |
          echo "Executing static application security testing (SAST)..."
          # Example: run a tool like SonarQube scanner or a simple secret scanner
          echo "Security scan completed. Review results in external tool."
      # Fail the build if security scan finds critical issues (configured in the actual tool)
      continueOnError: true # Set to false in a strict production environment

    # 4. Docker Build and Push
    - task: Docker@2
      displayName: Build and Push Image to ACR
      inputs:
        command: buildAndPush
        repository: '$(imageRepository)'
        dockerfile: '$(dockerfilePath)'
        containerRegistry: '$(acrServiceConnection)'
        tags: |
          $(tag)
          latest

    # 5. Publish Artifacts (e.g., Helm Chart or Kubernetes Manifests)
    - task: PublishPipelineArtifact@1
      displayName: Publish Deployment Artifacts
      inputs:
        targetPath: '$(helmChartPath)' # Publish the Helm chart
        artifact: 'manifests'
        publishLocation: 'pipeline'

# ==============================================================================
# STAGE 2: DEPLOY TO STAGING
# ==============================================================================
- stage: DeployStaging
  displayName: Deploy to Staging
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: Deploy
    displayName: Deploy to Staging Environment
    environment: 'Staging' # Requires an environment named 'Staging' in Azure DevOps
    strategy:
      runOnce:
        deploy:
          steps:
          # 1. Download Artifacts
          - task: DownloadPipelineArtifact@2
            displayName: Download Manifests
            inputs:
              artifactName: 'manifests'
              targetPath: '$(Pipeline.Workspace)/manifests'

          # 2. Kubernetes Deployment (using Helm)
          - task: HelmDeploy@0
            displayName: Helm Upgrade/Install
            inputs:
              connectionType: 'kubernetesServiceConnection'
              kubernetesServiceConnection: '$(aksServiceConnection)'
              namespace: '$(kubernetesNamespace)'
              command: 'upgrade'
              chartType: 'FilePath'
              chartPath: '$(Pipeline.Workspace)/manifests'
              releaseName: 'my-app-staging'
              arguments: '--set image.tag=$(tag),image.repository=$(acrName).azurecr.io/$(imageRepository)'
              valueOverrides: 'imagePullSecret=$(imagePullSecret)'
              waitForExecution: true
              
          # 3. Rollback Capability (Implicit in Helm/Kubernetes, but can be explicit)
          # Helm automatically manages revisions, allowing for easy rollback.
          # To enforce a manual rollback step, you could add a script here or rely on the Helm history.
          - script: echo "Deployment to Staging successful. Helm revision history available for rollback."
            displayName: Rollback Note

# ==============================================================================
# STAGE 3: DEPLOY TO PRODUCTION
# ==============================================================================
- stage: DeployProduction
  displayName: Deploy to Production
  dependsOn: DeployStaging
  condition: succeeded()
  jobs:
  - deployment: Deploy
    displayName: Deploy to Production Environment
    environment: 'Production' # Requires an environment named 'Production' in Azure DevOps
    # Add manual approval check for production deployment
    # This is configured in the Azure DevOps Environment settings (e.g., 'Production' environment)
    strategy:
      # Using a Canary or Blue/Green strategy is recommended for production, 
      # but 'runOnce' is used here for simplicity and to demonstrate the structure.
      runOnce:
        deploy:
          steps:
          # 1. Download Artifacts
          - task: DownloadPipelineArtifact@2
            displayName: Download Manifests
            inputs:
              artifactName: 'manifests'
              targetPath: '$(Pipeline.Workspace)/manifests'

          # 2. Kubernetes Deployment (using Helm)
          - task: HelmDeploy@0
            displayName: Helm Upgrade/Install
            inputs:
              connectionType: 'kubernetesServiceConnection'
              kubernetesServiceConnection: '$(aksServiceConnection)'
              namespace: '$(kubernetesNamespace)'
              command: 'upgrade'
              chartType: 'FilePath'
              chartPath: '$(Pipeline.Workspace)/manifests'
              releaseName: 'my-app-production'
              arguments: '--set image.tag=$(tag),image.repository=$(acrName).azurecr.io/$(imageRepository)'
              valueOverrides: 'imagePullSecret=$(imagePullSecret)'
              waitForExecution: true

          # 3. Rollback Capability (Explicit Rollback Step Example)
          # This step is a placeholder for a script that could trigger a rollback 
          # if a post-deployment health check fails.
          - script: |
              echo "Running post-deployment health checks..."
              # if [ health_check_failed ]; then
              #   echo "Health check failed. Initiating rollback."
              #   helm rollback my-app-production 1 # Rollback to previous revision
              # fi
              echo "Deployment to Production successful. Helm revision history available for rollback."
            displayName: Post-Deployment Health Check and Rollback

# ==============================================================================
# NOTIFICATIONS
# ==============================================================================
# Notifications are typically configured at the Azure DevOps Project/Pipeline settings level.
# For custom notifications (e.g., Slack, Teams), a final job can be added.
- stage: Notify
  displayName: Send Notifications
  dependsOn: DeployProduction
  condition: always() # Run regardless of success/failure of previous stages
  jobs:
  - job: Notify
    displayName: Send Status Notification
    steps:
    - script: |
        if [ "$[dependencies.DeployProduction.result]" == "Succeeded" ]; then
          echo "Pipeline completed successfully. Sending success notification to team."
        else
          echo "Pipeline failed. Sending failure notification to team."
        fi
        # In a real scenario, this would be a task for Slack/Teams/Email notification
        # Example:
        # - task: SlackNotification@1
        #   inputs:
        #     webhookUrl: '$(slackWebhookUrl)'
        #     message: 'CI/CD Pipeline $(Build.DefinitionName) completed with status: $[dependencies.DeployProduction.result]'
      displayName: Send Notification to External System