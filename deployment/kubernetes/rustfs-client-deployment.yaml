apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs-client
  namespace: neobank
  labels:
    app: rustfs-client
    component: storage
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rustfs-client
  template:
    metadata:
      labels:
        app: rustfs-client
        component: storage
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: neobank-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: rustfs-client
          image: neobank/rustfs-client:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8090
              name: http
          env:
            - name: RUSTFS_ENDPOINT
              value: "http://rustfs.lakehouse:9000"
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-secrets
                  key: access-key
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-secrets
                  key: secret-key
            - name: RUSTFS_REGION
              value: "us-east-1"
            - name: RUSTFS_BUCKET
              value: "neobank-lakehouse"
            - name: PORT
              value: "8090"
            - name: LOG_LEVEL
              value: "info"
            - name: ENABLE_METRICS
              value: "true"
            - name: USE_PATH_STYLE
              value: "true"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - rustfs-client
                topologyKey: kubernetes.io/hostname

---
apiVersion: v1
kind: Service
metadata:
  name: rustfs-client
  namespace: neobank
  labels:
    app: rustfs-client
spec:
  selector:
    app: rustfs-client
  ports:
    - port: 8090
      targetPort: 8090
      name: http
  type: ClusterIP

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rustfs-client-pdb
  namespace: neobank
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: rustfs-client

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rustfs-client-hpa
  namespace: neobank
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rustfs-client
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
