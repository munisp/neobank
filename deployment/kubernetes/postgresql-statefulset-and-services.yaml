apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: postgres-prod
    app.kubernetes.io/component: database
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9187" # Assuming a standard postgres exporter port, though not included in this manifest
type: Opaque
data:
  # Base64 encoded: 'postgres'
  POSTGRES_USER: cG9zdGdyZXM=
  # CHANGE_ME: Replace with base64-encoded production password
  POSTGRES_PASSWORD: Q0hBTkdFX01FX1BPU1RHUkVTX1BBU1NXT1JE
  # Base64 encoded: 'neobank'
  POSTGRES_DB: bmVvYmFuaw==
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: postgres-prod
    app.kubernetes.io/component: database
spec:
  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: postgres-prod
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
  clusterIP: None # Headless service for StatefulSet
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-statefulset
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: postgres-prod
    app.kubernetes.io/component: database
spec:
  serviceName: "postgres-service"
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/instance: postgres-prod
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/instance: postgres-prod
        app.kubernetes.io/component: database
      annotations:
        # Example annotations for logging/monitoring
        logging/level: "info"
        monitoring/enabled: "true"
    spec:
      securityContext:
        # Run as non-root user (e.g., 70 for postgres)
        fsGroup: 70
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - secretRef:
                name: postgres-secret
          resources:
            requests:
              cpu: "500m" # Request half of the limit to ensure scheduling
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
              # The official postgres image requires this path to be writable, so readOnly: true is not possible here.
          securityContext:
            # Run as non-root user (e.g., 70 for postgres)
            runAsUser: 70
            runAsGroup: 70
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true # Set root filesystem to read-only
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
        labels:
          app.kubernetes.io/name: postgres
          app.kubernetes.io/instance: postgres-prod
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-clusterip-service
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: postgres-prod
    app.kubernetes.io/component: database
spec:
  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: postgres-prod
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
  type: ClusterIP # Standard ClusterIP service for external/application access
