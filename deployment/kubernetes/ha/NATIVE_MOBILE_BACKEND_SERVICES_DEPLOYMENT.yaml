---
# HPA for Mobile API Gateway
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mobile-api-gateway-hpa
  namespace: neobank-mobile-services
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mobile-api-gateway
  minReplicas: 5
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---
# HPA for Push Notification Service
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: push-notification-hpa
  namespace: neobank-mobile-services
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: push-notification-service
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70

---
# HPA for WebSocket Server
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: websocket-server-hpa
  namespace: neobank-mobile-services
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: websocket-server
  minReplicas: 5
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---
# Pod Disruption Budget for Mobile API Gateway
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mobile-api-gateway-pdb
  namespace: neobank-mobile-services
spec:
  minAvailable: 3
  selector:
    matchLabels:
      app: mobile-api-gateway

---
# Pod Disruption Budget for WebSocket Server
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: websocket-server-pdb
  namespace: neobank-mobile-services
spec:
  minAvailable: 3
  selector:
    matchLabels:
      app: websocket-server

---
# Ingress for Mobile Services
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mobile-services-ingress
  namespace: neobank-mobile-services
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/websocket-services: "websocket-server"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/rate-limit: "100"
spec:
  tls:
  - hosts:
    - mobile-api.neobank.com
    - ws.neobank.com
    secretName: mobile-services-tls
  
  rules:
  # Mobile API Gateway
  - host: mobile-api.neobank.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mobile-api-gateway
            port:
              number: 9080
  
  # WebSocket Server
  - host: ws.neobank.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: websocket-server
            port:
              number: 8080

---
# Network Policy for Mobile Services
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mobile-services-network-policy
  namespace: neobank-mobile-services
spec:
  podSelector:
    matchLabels:
      tier: mobile
  policyTypes:
  - Ingress
  - Egress
  
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8000
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 9080
  
  egress:
  # DNS
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
    ports:
    - protocol: UDP
      port: 53
  
  # Backend API
  - to:
    - namespaceSelector:
        matchLabels:
          name: neobank-production
      podSelector:
        matchLabels:
          app: backend-api
    ports:
    - protocol: TCP
      port: 8000
  
  # Redis
  - to:
    - namespaceSelector:
        matchLabels:
          name: neobank-production
      podSelector:
        matchLabels:
          app: redis-cluster
    ports:
    - protocol: TCP
      port: 6379
  
  # External HTTPS (Firebase, APNS, etc.)
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443

---
# Service Monitor for Prometheus
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: mobile-services-monitor
  namespace: neobank-mobile-services
  labels:
    prometheus: kube-prometheus
spec:
  selector:
    matchLabels:
      tier: mobile
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics

---
# Deployment Summary
# ====================
# 
# Mobile Backend Services:
# ✅ Mobile API Gateway (APISIX) - 5-20 replicas
# ✅ Push Notification Service (FCM/APNS) - 3-10 replicas
# ✅ WebSocket Server (Real-time) - 5-20 replicas
# ✅ Mobile Analytics Service - 3 replicas
# ✅ App Version Control Service - 2 replicas
# ✅ Deep Link Service - 2 replicas
# ✅ Mobile Session Manager - 3 replicas
# 
# Total Services: 7
# Total Pods (minimum): 23
# Total Pods (maximum): 57 (under high load)
# 
# Resource Requirements (minimum):
# - CPU: ~12 cores
# - Memory: ~24GB
# 
# Resource Requirements (maximum):
# - CPU: ~40 cores
# - Memory: ~80GB
# 
# High Availability Features:
# ✅ Auto-scaling (HPA)
# ✅ Pod anti-affinity
# ✅ Pod disruption budgets
# ✅ Rolling updates
# ✅ Health checks
# ✅ Network policies
# ✅ Prometheus monitoring
# 
# External Integrations:
# ✅ Firebase Cloud Messaging (FCM)
# ✅ Apple Push Notification Service (APNS)
# ✅ Redis (session/cache)
# ✅ Backend API
# ✅ Analytics platforms (Mixpanel, Amplitude)
# ✅ Monitoring (Sentry, Prometheus)
# 
# Deployment Commands:
# ====================
# 
# 1. Deploy all services:
#    kubectl apply -f NATIVE_MOBILE_BACKEND_SERVICES_DEPLOYMENT.yaml
# 
# 2. Verify deployment:
#    kubectl get all -n neobank-mobile-services
#    kubectl get hpa -n neobank-mobile-services
#    kubectl get pdb -n neobank-mobile-services
# 
# 3. Check logs:
#    kubectl logs -f deployment/mobile-api-gateway -n neobank-mobile-services
#    kubectl logs -f deployment/push-notification-service -n neobank-mobile-services
#    kubectl logs -f deployment/websocket-server -n neobank-mobile-services
# 
# 4. Test endpoints:
#    # Mobile API Gateway
#    curl https://mobile-api.neobank.com/health
