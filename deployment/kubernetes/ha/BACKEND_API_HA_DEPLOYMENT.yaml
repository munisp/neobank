# NeoBank Backend API - High Availability Kubernetes Deployment
# Production-Ready Configuration with Auto-Scaling, Multi-AZ, and Advanced Health Checks
# Version: 1.0.0

---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: neobank-production
  labels:
    name: neobank-production
    tier: production
    environment: production

---
# Backend API ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-api-config
  namespace: neobank-production
data:
  # Application Configuration
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  API_V1_STR: "/api/v1"
  PROJECT_NAME: "NeoBank Production API"
  
  # Database Configuration
  POSTGRES_DB: "neobank_production"
  POSTGRES_HOST: "postgresql-primary"
  POSTGRES_PORT: "5432"
  
  # Redis Configuration
  REDIS_HOST: "redis-headless"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  
  # MongoDB Configuration (if needed)
  MONGODB_HOST: "mongodb-headless"
  MONGODB_PORT: "27017"
  MONGODB_DATABASE: "neobank_documents"
  
  # TigerBeetle Configuration
  TIGERBEETLE_CLUSTER_ID: "0"
  TIGERBEETLE_ADDRESSES: "tigerbeetle-0.tigerbeetle-headless:3000,tigerbeetle-1.tigerbeetle-headless:3000,tigerbeetle-2.tigerbeetle-headless:3000"
  
  # Performance Tuning
  WORKERS: "4"
  MAX_CONNECTIONS: "1000"
  POOL_SIZE: "20"
  MAX_OVERFLOW: "10"
  
  # Security
  CORS_ORIGINS: '["https://neobank.com","https://www.neobank.com","https://app.neobank.com"]'
  ALLOWED_HOSTS: '["neobank.com","www.neobank.com","app.neobank.com","api.neobank.com"]'
  
  # Monitoring
  PROMETHEUS_ENABLED: "true"
  PROMETHEUS_MULTIPROC_DIR: "/tmp/prometheus_multiproc_dir"
  JAEGER_ENABLED: "true"
  JAEGER_AGENT_HOST: "jaeger-agent"
  JAEGER_AGENT_PORT: "6831"
  
  # Rate Limiting
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_PER_MINUTE: "100"
  RATE_LIMIT_BURST: "20"

---
# Backend API Secrets
apiVersion: v1
kind: Secret
metadata:
  name: backend-api-secrets
  namespace: neobank-production
type: Opaque
stringData:
  # Database Credentials
  POSTGRES_USER: "neobank_user"
  POSTGRES_PASSWORD: "CHANGE_ME_STRONG_PASSWORD_32_CHARS"
  
  # Redis Password
  REDIS_PASSWORD: "CHANGE_ME_REDIS_PASSWORD_32_CHARS"
  
  # JWT Configuration
  JWT_SECRET_KEY: "CHANGE_ME_JWT_SECRET_256_BITS_MINIMUM"
  JWT_ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  REFRESH_TOKEN_EXPIRE_DAYS: "7"
  
  # Encryption
  ENCRYPTION_KEY: "CHANGE_ME_ENCRYPTION_KEY_256_BITS"
  
  # External Services
  PAYSTACK_SECRET_KEY: "your_paystack_secret_key"
  FLUTTERWAVE_SECRET_KEY: "your_flutterwave_secret_key"
  BALLERINE_API_KEY: "your_ballerine_api_key"
  
  # Monitoring
  SENTRY_DSN: "your_sentry_dsn_here"

---
# Backend API Deployment with High Availability
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api
  namespace: neobank-production
  labels:
    app: backend-api
    tier: backend
    version: v1.0.0
spec:
  # High Availability: Start with 5 replicas, can scale to 20
  replicas: 5
  
  # Rolling Update Strategy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2              # Allow 2 extra pods during update
      maxUnavailable: 1        # Keep at least 4 pods running during update
  
  selector:
    matchLabels:
      app: backend-api
      tier: backend
  
  template:
    metadata:
      labels:
        app: backend-api
        tier: backend
        version: v1.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    
    spec:
      # Pod Anti-Affinity: Spread pods across different nodes for HA
      affinity:
        podAntiAffinity:
          # REQUIRED: Pods must be on different nodes
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - backend-api
            topologyKey: kubernetes.io/hostname
          
          # PREFERRED: Spread across different availability zones
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - backend-api
              topologyKey: topology.kubernetes.io/zone
      
      # Security Context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      
      # Init Container: Wait for databases to be ready
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          until nc -z postgresql-primary 5432; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
          echo "PostgreSQL is ready!"
      
      - name: wait-for-redis
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          until nc -z redis-headless 6379; do
            echo "Waiting for Redis..."
            sleep 2
          done
          echo "Redis is ready!"
      
      # Main Container: FastAPI Backend
      containers:
      - name: backend-api
        image: neobank-backend:v1.0.0
        imagePullPolicy: Always
        
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        
        # Environment Variables from ConfigMap
        envFrom:
        - configMapRef:
            name: backend-api-config
        - secretRef:
            name: backend-api-secrets
        
        # Additional Environment Variables
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        
        # Resource Limits and Requests
        resources:
          requests:
            cpu: 1000m           # 1 CPU core
            memory: 2Gi          # 2GB RAM
          limits:
            cpu: 2000m           # 2 CPU cores max
            memory: 4Gi          # 4GB RAM max
        
        # Volume Mounts
        volumeMounts:
        - name: app-logs
          mountPath: /app/logs
        - name: tmp
          mountPath: /tmp
        - name: prometheus-multiproc
          mountPath: /tmp/prometheus_multiproc_dir
        
        # Liveness Probe: Restart if unhealthy
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
            httpHeaders:
            - name: User-Agent
              value: "Kubernetes-Liveness-Probe"
          initialDelaySeconds: 60      # Wait 60s after start
          periodSeconds: 10             # Check every 10s
          timeoutSeconds: 5             # Timeout after 5s
          successThreshold: 1           # 1 success = healthy
          failureThreshold: 3           # 3 failures = restart pod
        
        # Readiness Probe: Remove from service if not ready
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
            httpHeaders:
            - name: User-Agent
              value: "Kubernetes-Readiness-Probe"
          initialDelaySeconds: 30      # Wait 30s after start
          periodSeconds: 5              # Check every 5s
          timeoutSeconds: 3             # Timeout after 3s
          successThreshold: 1           # 1 success = ready
          failureThreshold: 2           # 2 failures = not ready
        
        # Startup Probe: Allow slow startup (up to 5 minutes)
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 30          # 30 * 10s = 5 minutes max startup time
        
        # Lifecycle Hooks
        lifecycle:
          preStop:
            exec:
              command:
              - sh
              - -c
              - |
                # Graceful shutdown: wait for active requests to complete
                sleep 15
        
        # Security Context
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
      
      # Volumes
      volumes:
      - name: app-logs
        emptyDir: {}
      - name: tmp
        emptyDir: {}
      - name: prometheus-multiproc
        emptyDir: {}
      
      # DNS Configuration
      dnsPolicy: ClusterFirst
      
      # Restart Policy
      restartPolicy: Always
      
      # Termination Grace Period (for graceful shutdown)
      terminationGracePeriodSeconds: 30
      
      # Image Pull Secrets (if using private registry)
      # imagePullSecrets:
      # - name: regcred

---
# Backend API Service (ClusterIP)
apiVersion: v1
kind: Service
metadata:
  name: backend-api
  namespace: neobank-production
  labels:
    app: backend-api
    tier: backend
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
spec:
  type: ClusterIP
  selector:
    app: backend-api
    tier: backend
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800  # 3 hours

---
# Backend API Service (Headless for direct pod access)
apiVersion: v1
kind: Service
metadata:
  name: backend-api-headless
  namespace: neobank-production
  labels:
    app: backend-api
    tier: backend
spec:
  clusterIP: None
  selector:
    app: backend-api
    tier: backend
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP

---
# Horizontal Pod Autoscaler (HPA)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-api-hpa
  namespace: neobank-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend-api
  
  # Scaling Configuration
  minReplicas: 5              # Minimum 5 pods for HA
  maxReplicas: 20             # Maximum 20 pods under high load
  
  # Scaling Behavior
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300    # Wait 5 minutes before scaling down
      policies:
      - type: Percent
        value: 10                         # Scale down max 10% of pods at a time
        periodSeconds: 60
      - type: Pods
        value: 2                          # Or max 2 pods at a time
        periodSeconds: 60
      selectPolicy: Min                   # Use the minimum of the two policies
    
    scaleUp:
      stabilizationWindowSeconds: 0       # Scale up immediately
      policies:
      - type: Percent
        value: 50                         # Scale up max 50% of pods at a time
        periodSeconds: 60
      - type: Pods
        value: 4                          # Or max 4 pods at a time
        periodSeconds: 60
      selectPolicy: Max                   # Use the maximum of the two policies
  
  # Metrics for Auto-Scaling
  metrics:
  # CPU-based scaling
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70           # Scale up if CPU > 70%
  
  # Memory-based scaling
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80           # Scale up if memory > 80%
  
  # Custom metric: Request rate (if using metrics server)
  # - type: Pods
  #   pods:
  #     metric:
  #       name: http_requests_per_second
  #     target:
  #       type: AverageValue
  #       averageValue: "1000"           # Scale up if > 1000 req/s per pod

---
# Pod Disruption Budget (PDB)
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend-api-pdb
  namespace: neobank-production
spec:
  minAvailable: 3              # Always keep at least 3 pods running
  selector:
    matchLabels:
      app: backend-api
      tier: backend

---
# Network Policy (Security)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-api-network-policy
  namespace: neobank-production
spec:
  podSelector:
    matchLabels:
      app: backend-api
  policyTypes:
  - Ingress
  - Egress
  
  # Ingress Rules: Who can connect to backend API
  ingress:
  - from:
    # Allow from APISIX gateway
    - podSelector:
        matchLabels:
          app: apisix-gateway
    # Allow from frontend
    - podSelector:
        matchLabels:
          app: frontend
    # Allow from monitoring (Prometheus)
    - podSelector:
        matchLabels:
          app: prometheus
    ports:
    - protocol: TCP
      port: 8000
    - protocol: TCP
      port: 9090
  
  # Egress Rules: Where backend API can connect
  egress:
  # Allow DNS
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
    ports:
    - protocol: UDP
      port: 53
  
  # Allow PostgreSQL
  - to:
    - podSelector:
        matchLabels:
          app: postgresql-primary
    ports:
    - protocol: TCP
      port: 5432
  
  # Allow Redis
  - to:
    - podSelector:
        matchLabels:
          app: redis-cluster
    ports:
    - protocol: TCP
      port: 6379
  
  # Allow TigerBeetle
  - to:
    - podSelector:
        matchLabels:
          app: tigerbeetle
    ports:
    - protocol: TCP
      port: 3000
  
  # Allow external HTTPS (for external APIs)
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443

---
# Service Monitor (for Prometheus)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: backend-api-monitor
  namespace: neobank-production
  labels:
    app: backend-api
    prometheus: kube-prometheus
spec:
  selector:
    matchLabels:
      app: backend-api
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics
    scheme: http

---
# Ingress (External Access via APISIX)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-api-ingress
  namespace: neobank-production
  annotations:
    kubernetes.io/ingress.class: "apisix"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/limit-rps: "50"
spec:
  tls:
  - hosts:
    - api.neobank.com
    secretName: backend-api-tls
  
  rules:
  - host: api.neobank.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: backend-api
            port:
              number: 8000

---
# Deployment Summary
# ====================
# 
# High Availability Features:
# ✅ 5 replicas minimum (scales to 20 under load)
# ✅ Pod anti-affinity (spread across nodes and AZs)
# ✅ Rolling updates (max 1 unavailable, max 2 surge)
# ✅ Pod Disruption Budget (min 3 pods always available)
# ✅ Horizontal Pod Autoscaler (CPU, memory, custom metrics)
# ✅ Health checks (liveness, readiness, startup probes)
# ✅ Graceful shutdown (30s termination grace period)
# ✅ Resource limits (CPU: 1-2 cores, Memory: 2-4GB)
# ✅ Network policies (ingress/egress security)
# ✅ Prometheus monitoring integration
# ✅ SSL/TLS termination
# ✅ Rate limiting
# 
# Resource Requirements per Pod:
# - CPU: 1 core (request), 2 cores (limit)
# - Memory: 2GB (request), 4GB (limit)
# 
# Total Cluster Resources (5 pods):
# - CPU: 5 cores (request), 10 cores (limit)
# - Memory: 10GB (request), 20GB (limit)
# 
# Scaling Behavior:
# - Scale up: Immediately when CPU > 70% or Memory > 80%
# - Scale down: After 5 minutes of low usage
# - Max scale up: 50% or 4 pods at a time
# - Max scale down: 10% or 2 pods at a time
# 
# Deployment Commands:
# ====================
# 
# 1. Create namespace and secrets:
#    kubectl apply -f backend-api-ha-deployment.yaml
# 
# 2. Verify deployment:
#    kubectl get pods -n neobank-production -l app=backend-api
#    kubectl get hpa -n neobank-production
#    kubectl get pdb -n neobank-production
# 
# 3. Check logs:
#    kubectl logs -f deployment/backend-api -n neobank-production
# 
# 4. Scale manually (if needed):
#    kubectl scale deployment backend-api --replicas=10 -n neobank-production
# 
# 5. Rolling update:
#    kubectl set image deployment/backend-api backend-api=neobank-backend:v1.1.0 -n neobank-production
#    kubectl rollout status deployment/backend-api -n neobank-production
# 
# 6. Rollback:
#    kubectl rollout undo deployment/backend-api -n neobank-production
# 
# 7. Test endpoint:
#    kubectl port-forward svc/backend-api 8000:8000 -n neobank-production
#    curl http://localhost:8000/health
