# OpenSearch Cluster Deployment for NeoBank
# Comprehensive search and analytics platform for banking operations
# Author: Manus AI - NeoBank Observability Team
# Version: 2.0 Production

---
# Namespace for OpenSearch
apiVersion: v1
kind: Namespace
metadata:
  name: opensearch-system
  labels:
    name: opensearch-system
    tier: observability

---
# OpenSearch Master Nodes
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: opensearch-master
  namespace: opensearch-system
  labels:
    app.kubernetes.io/name: opensearch
    app.kubernetes.io/component: master
spec:
  serviceName: opensearch-master-headless
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: opensearch
      app.kubernetes.io/component: master
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opensearch
        app.kubernetes.io/component: master
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9600"
    spec:
      serviceAccountName: opensearch
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
      
      initContainers:
      - name: configure-sysctl
        image: busybox:1.35
        command: ['sh', '-c', 'sysctl -w vm.max_map_count=262144']
        securityContext:
          privileged: true
      
      containers:
      - name: opensearch
        image: opensearchproject/opensearch:2.11.0
        imagePullPolicy: Always
        
        env:
        - name: cluster.name
          value: "neobank-opensearch"
        - name: node.name
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: discovery.seed_hosts
          value: "opensearch-master-headless"
        - name: cluster.initial_master_nodes
          value: "opensearch-master-0,opensearch-master-1,opensearch-master-2"
        - name: node.roles
          value: "master"
        - name: bootstrap.memory_lock
          value: "true"
        - name: OPENSEARCH_JAVA_OPTS
          value: "-Xms4g -Xmx4g"
        - name: DISABLE_SECURITY_PLUGIN
          value: "false"
        - name: OPENSEARCH_INITIAL_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: opensearch-credentials
              key: admin-password
        
        # Banking-specific configurations
        - name: indices.recovery.max_bytes_per_sec
          value: "100mb"
        - name: indices.memory.index_buffer_size
          value: "20%"
        - name: thread_pool.write.queue_size
          value: "1000"
        - name: thread_pool.search.queue_size
          value: "10000"
        
        resources:
          requests:
            cpu: 2
            memory: 8Gi
          limits:
            cpu: 4
            memory: 8Gi
        
        ports:
        - name: http
          containerPort: 9200
        - name: transport
          containerPort: 9300
        - name: metrics
          containerPort: 9600
        
        livenessProbe:
          httpGet:
            path: /_cluster/health?local=true
            port: 9200
            scheme: HTTPS
          initialDelaySeconds: 90
          periodSeconds: 30
          timeoutSeconds: 10
        
        readinessProbe:
          httpGet:
            path: /_cluster/health?wait_for_status=green&timeout=1s
            port: 9200
            scheme: HTTPS
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
        
        volumeMounts:
        - name: opensearch-data
          mountPath: /usr/share/opensearch/data
        - name: opensearch-config
          mountPath: /usr/share/opensearch/config/opensearch.yml
          subPath: opensearch.yml
        - name: opensearch-security-config
          mountPath: /usr/share/opensearch/config/opensearch-security
      
      volumes:
      - name: opensearch-config
        configMap:
          name: opensearch-config
      - name: opensearch-security-config
        secret:
          secretName: opensearch-security-config
  
  volumeClaimTemplates:
  - metadata:
      name: opensearch-data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: fast-ssd
      resources:
        requests:
          storage: 200Gi

---
# OpenSearch Data Nodes
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: opensearch-data
  namespace: opensearch-system
  labels:
    app.kubernetes.io/name: opensearch
    app.kubernetes.io/component: data
spec:
  serviceName: opensearch-data-headless
  replicas: 6
  selector:
    matchLabels:
      app.kubernetes.io/name: opensearch
      app.kubernetes.io/component: data
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opensearch
        app.kubernetes.io/component: data
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9600"
    spec:
      serviceAccountName: opensearch
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
      
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: ["data"]
            topologyKey: kubernetes.io/hostname
      
      initContainers:
      - name: configure-sysctl
        image: busybox:1.35
        command: ['sh', '-c', 'sysctl -w vm.max_map_count=262144']
        securityContext:
          privileged: true
      
      containers:
      - name: opensearch
        image: opensearchproject/opensearch:2.11.0
        imagePullPolicy: Always
        
        env:
        - name: cluster.name
          value: "neobank-opensearch"
        - name: node.name
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: discovery.seed_hosts
          value: "opensearch-master-headless"
        - name: cluster.initial_master_nodes
          value: "opensearch-master-0,opensearch-master-1,opensearch-master-2"
        - name: node.roles
          value: "data,ingest"
        - name: bootstrap.memory_lock
          value: "true"
        - name: OPENSEARCH_JAVA_OPTS
          value: "-Xms8g -Xmx8g"
        - name: DISABLE_SECURITY_PLUGIN
          value: "false"
        
        # Banking performance optimizations
        - name: indices.fielddata.cache.size
          value: "30%"
        - name: indices.queries.cache.size
          value: "20%"
        - name: indices.requests.cache.size
          value: "5%"
        
        resources:
          requests:
            cpu: 4
            memory: 16Gi
          limits:
            cpu: 8
            memory: 16Gi
        
        ports:
        - name: http
          containerPort: 9200
        - name: transport
          containerPort: 9300
        - name: metrics
          containerPort: 9600
        
        livenessProbe:
          httpGet:
            path: /_cluster/health?local=true
            port: 9200
            scheme: HTTPS
          initialDelaySeconds: 90
          periodSeconds: 30
        
        readinessProbe:
          httpGet:
            path: /_cluster/health?local=true
            port: 9200
            scheme: HTTPS
          initialDelaySeconds: 60
          periodSeconds: 10
        
        volumeMounts:
        - name: opensearch-data
          mountPath: /usr/share/opensearch/data
        - name: opensearch-config
          mountPath: /usr/share/opensearch/config/opensearch.yml
          subPath: opensearch.yml
        - name: opensearch-security-config
          mountPath: /usr/share/opensearch/config/opensearch-security
      
      volumes:
      - name: opensearch-config
        configMap:
          name: opensearch-config
      - name: opensearch-security-config
        secret:
          secretName: opensearch-security-config
  
  volumeClaimTemplates:
  - metadata:
      name: opensearch-data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: fast-ssd
      resources:
        requests:
          storage: 500Gi

---
# OpenSearch Coordinating Nodes
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensearch-coordinating
  namespace: opensearch-system
  labels:
    app.kubernetes.io/name: opensearch
    app.kubernetes.io/component: coordinating
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: opensearch
      app.kubernetes.io/component: coordinating
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opensearch
        app.kubernetes.io/component: coordinating
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9600"
    spec:
      serviceAccountName: opensearch
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
      
      containers:
      - name: opensearch
        image: opensearchproject/opensearch:2.11.0
        imagePullPolicy: Always
        
        env:
        - name: cluster.name
          value: "neobank-opensearch"
        - name: node.name
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: discovery.seed_hosts
          value: "opensearch-master-headless"
        - name: cluster.initial_master_nodes
          value: "opensearch-master-0,opensearch-master-1,opensearch-master-2"
        - name: node.roles
          value: ""  # Coordinating only
        - name: bootstrap.memory_lock
          value: "true"
        - name: OPENSEARCH_JAVA_OPTS
          value: "-Xms2g -Xmx2g"
        - name: DISABLE_SECURITY_PLUGIN
          value: "false"
        
        resources:
          requests:
            cpu: 1
            memory: 4Gi
          limits:
            cpu: 2
            memory: 4Gi
        
        ports:
        - name: http
          containerPort: 9200
        - name: transport
          containerPort: 9300
        - name: metrics
          containerPort: 9600
        
        livenessProbe:
          httpGet:
            path: /_cluster/health?local=true
            port: 9200
            scheme: HTTPS
          initialDelaySeconds: 60
          periodSeconds: 30
        
        readinessProbe:
          httpGet:
            path: /_cluster/health?local=true
            port: 9200
            scheme: HTTPS
          initialDelaySeconds: 30
          periodSeconds: 10
        
        volumeMounts:
        - name: opensearch-config
          mountPath: /usr/share/opensearch/config/opensearch.yml
          subPath: opensearch.yml
        - name: opensearch-security-config
          mountPath: /usr/share/opensearch/config/opensearch-security
      
      volumes:
      - name: opensearch-config
        configMap:
          name: opensearch-config
      - name: opensearch-security-config
        secret:
          secretName: opensearch-security-config

---
# OpenSearch Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: opensearch-config
  namespace: opensearch-system
  labels:
    app.kubernetes.io/name: opensearch
    app.kubernetes.io/component: config
data:
  opensearch.yml: |
    # Cluster Configuration
    cluster.name: neobank-opensearch
    network.host: 0.0.0.0
    http.port: 9200
    transport.port: 9300
    
    # Discovery Configuration
    discovery.type: zen
    discovery.zen.minimum_master_nodes: 2
    discovery.zen.ping_timeout: 30s
    discovery.zen.fd.ping_interval: 10s
    discovery.zen.fd.ping_timeout: 60s
    discovery.zen.fd.ping_retries: 5
    
    # Memory and Performance
    bootstrap.memory_lock: true
    indices.memory.index_buffer_size: 20%
    indices.memory.min_index_buffer_size: 96mb
    indices.fielddata.cache.size: 30%
    indices.queries.cache.size: 20%
    indices.requests.cache.size: 5%
    
    # Banking-specific optimizations
    indices.recovery.max_bytes_per_sec: 100mb
    cluster.routing.allocation.disk.threshold_enabled: true
    cluster.routing.allocation.disk.watermark.low: 85%
    cluster.routing.allocation.disk.watermark.high: 90%
    cluster.routing.allocation.disk.watermark.flood_stage: 95%
    
    # Thread Pool Configuration
    thread_pool:
      write:
        size: 8
        queue_size: 1000
      search:
        size: 16
        queue_size: 10000
      get:
        size: 8
        queue_size: 1000
      analyze:
        size: 1
        queue_size: 16
      index:
        size: 8
        queue_size: 200
    
    # Security Configuration
    plugins.security.ssl.transport.pemcert_filepath: certs/node.pem
    plugins.security.ssl.transport.pemkey_filepath: certs/node-key.pem
    plugins.security.ssl.transport.pemtrustedcas_filepath: certs/root-ca.pem
    plugins.security.ssl.transport.enforce_hostname_verification: false
    plugins.security.ssl.http.enabled: true
    plugins.security.ssl.http.pemcert_filepath: certs/node.pem
    plugins.security.ssl.http.pemkey_filepath: certs/node-key.pem
    plugins.security.ssl.http.pemtrustedcas_filepath: certs/root-ca.pem
    plugins.security.allow_unsafe_democertificates: false
    plugins.security.allow_default_init_securityindex: true
    plugins.security.authcz.admin_dn:
      - CN=admin,OU=client,O=client,L=test,C=de
    plugins.security.audit.type: internal_opensearch
    plugins.security.enable_snapshot_restore_privilege: true
    plugins.security.check_snapshot_restore_write_privileges: true
    plugins.security.restapi.roles_enabled: ["all_access", "security_rest_api_access"]
    
    # Banking Compliance Settings
    action.auto_create_index: false
    action.destructive_requires_name: true
    cluster.blocks.delete_indices: false
    
    # Monitoring and Metrics
    http.cors.enabled: true
    http.cors.allow-origin: "*"
    http.cors.allow-methods: OPTIONS, HEAD, GET, POST, PUT, DELETE
    http.cors.allow-headers: X-Requested-With,X-Auth-Token,Content-Type,Content-Length

---
