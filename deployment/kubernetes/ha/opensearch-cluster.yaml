---
# Service Account for OpenSearch
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opensearch
  namespace: opensearch-system
  labels:
    app.kubernetes.io/name: opensearch

---
# ClusterRole for OpenSearch
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: opensearch
  labels:
    app.kubernetes.io/name: opensearch
rules:
- apiGroups: [""]
  resources: ["nodes", "nodes/stats", "services", "endpoints", "pods"]
  verbs: ["get", "list", "watch"]

---
# ClusterRoleBinding for OpenSearch
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: opensearch
  labels:
    app.kubernetes.io/name: opensearch
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: opensearch
subjects:
- kind: ServiceAccount
  name: opensearch
  namespace: opensearch-system

---
# Headless Service for Master Nodes
apiVersion: v1
kind: Service
metadata:
  name: opensearch-master-headless
  namespace: opensearch-system
  labels:
    app.kubernetes.io/name: opensearch
    app.kubernetes.io/component: master
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: opensearch
    app.kubernetes.io/component: master
  ports:
  - name: http
    port: 9200
    targetPort: 9200
  - name: transport
    port: 9300
    targetPort: 9300

---
# Headless Service for Data Nodes
apiVersion: v1
kind: Service
metadata:
  name: opensearch-data-headless
  namespace: opensearch-system
  labels:
    app.kubernetes.io/name: opensearch
    app.kubernetes.io/component: data
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: opensearch
    app.kubernetes.io/component: data
  ports:
  - name: http
    port: 9200
    targetPort: 9200
  - name: transport
    port: 9300
    targetPort: 9300

---
# Load Balancer Service for Client Access
apiVersion: v1
kind: Service
metadata:
  name: opensearch-client
  namespace: opensearch-system
  labels:
    app.kubernetes.io/name: opensearch
    app.kubernetes.io/component: client
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9600"
spec:
  selector:
    app.kubernetes.io/name: opensearch
    app.kubernetes.io/component: coordinating
  ports:
  - name: http
    port: 9200
    targetPort: 9200
  - name: metrics
    port: 9600
    targetPort: 9600
  type: ClusterIP

---
# OpenSearch Dashboards Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensearch-dashboards
  namespace: opensearch-system
  labels:
    app.kubernetes.io/name: opensearch-dashboards
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: opensearch-dashboards
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opensearch-dashboards
    spec:
      serviceAccountName: opensearch
      
      containers:
      - name: opensearch-dashboards
        image: opensearchproject/opensearch-dashboards:2.11.0
        imagePullPolicy: Always
        
        env:
        - name: OPENSEARCH_HOSTS
          value: "https://opensearch-client:9200"
        - name: SERVER_HOST
          value: "0.0.0.0"
        - name: SERVER_PORT
          value: "5601"
        - name: OPENSEARCH_USERNAME
          value: "admin"
        - name: OPENSEARCH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: opensearch-credentials
              key: admin-password
        
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2
            memory: 4Gi
        
        ports:
        - name: http
          containerPort: 5601
        
        livenessProbe:
          httpGet:
            path: /api/status
            port: 5601
          initialDelaySeconds: 120
          periodSeconds: 30
        
        readinessProbe:
          httpGet:
            path: /api/status
            port: 5601
          initialDelaySeconds: 60
          periodSeconds: 10
        
        volumeMounts:
        - name: dashboards-config
          mountPath: /usr/share/opensearch-dashboards/config/opensearch_dashboards.yml
          subPath: opensearch_dashboards.yml
      
      volumes:
      - name: dashboards-config
        configMap:
          name: opensearch-dashboards-config

---
# OpenSearch Dashboards Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: opensearch-dashboards-config
  namespace: opensearch-system
  labels:
    app.kubernetes.io/name: opensearch-dashboards
data:
  opensearch_dashboards.yml: |
    server.name: opensearch-dashboards
    server.host: "0.0.0.0"
    server.port: 5601
    
    opensearch.hosts: ["https://opensearch-client:9200"]
    opensearch.ssl.verificationMode: none
    opensearch.username: "admin"
    opensearch.password: "${OPENSEARCH_PASSWORD}"
    opensearch.requestHeadersAllowlist: ["securitytenant","Authorization"]
    
    opensearch_security.multitenancy.enabled: true
    opensearch_security.multitenancy.tenants.preferred: ["Private", "Global"]
    opensearch_security.readonly_mode.roles: ["kibana_read_only"]
    
    # Banking-specific dashboard settings
    newsfeed.enabled: false
    telemetry.optIn: false
    telemetry.enabled: false
    
    # Custom branding for NeoBank
    server.customResponseHeaders:
      "X-Frame-Options": "SAMEORIGIN"
      "X-Content-Type-Options": "nosniff"
      "X-XSS-Protection": "1; mode=block"

---
# Service for OpenSearch Dashboards
apiVersion: v1
kind: Service
metadata:
  name: opensearch-dashboards
  namespace: opensearch-system
  labels:
    app.kubernetes.io/name: opensearch-dashboards
spec:
  selector:
    app.kubernetes.io/name: opensearch-dashboards
  ports:
  - name: http
    port: 5601
    targetPort: 5601
  type: ClusterIP

---
# Ingress for OpenSearch Dashboards
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opensearch-dashboards
  namespace: opensearch-system
  labels:
    app.kubernetes.io/name: opensearch-dashboards
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - analytics.neobank.com
    secretName: opensearch-dashboards-tls
  rules:
  - host: analytics.neobank.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: opensearch-dashboards
            port:
              number: 5601
