# NeoBank Frontend Web - High Availability Kubernetes Deployment
# Production-Ready Configuration with CDN, Auto-Scaling, and Performance Optimization
# Version: 1.0.0

---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: neobank-production
  labels:
    name: neobank-production
    tier: production
    environment: production

---
# Frontend ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: neobank-production
data:
  # Next.js Configuration
  NODE_ENV: "production"
  NEXT_TELEMETRY_DISABLED: "1"
  
  # API Configuration
  NEXT_PUBLIC_API_URL: "https://api.neobank.com/api/v1"
  NEXT_PUBLIC_API_TIMEOUT: "30000"
  
  # Application Configuration
  NEXT_PUBLIC_APP_NAME: "NeoBank"
  NEXT_PUBLIC_APP_VERSION: "1.0.0"
  NEXT_PUBLIC_ENVIRONMENT: "production"
  
  # Feature Flags
  NEXT_PUBLIC_ENABLE_ANALYTICS: "true"
  NEXT_PUBLIC_ENABLE_PWA: "true"
  NEXT_PUBLIC_ENABLE_DARK_MODE: "true"
  NEXT_PUBLIC_ENABLE_NOTIFICATIONS: "true"
  
  # CDN Configuration
  NEXT_PUBLIC_CDN_URL: "https://cdn.neobank.com"
  NEXT_PUBLIC_STATIC_URL: "https://static.neobank.com"
  NEXT_PUBLIC_IMAGES_URL: "https://images.neobank.com"
  
  # Analytics
  NEXT_PUBLIC_GA_TRACKING_ID: "G-XXXXXXXXXX"
  NEXT_PUBLIC_SENTRY_DSN: "https://xxx@sentry.io/xxx"
  
  # Performance
  NEXT_PUBLIC_ENABLE_SERVICE_WORKER: "true"
  NEXT_PUBLIC_CACHE_MAX_AGE: "31536000"  # 1 year for static assets
  
  # Security
  NEXT_PUBLIC_CSP_ENABLED: "true"
  NEXT_PUBLIC_HSTS_ENABLED: "true"
  
  # Nginx Configuration
  nginx.conf: |
    user nginx;
    worker_processes auto;
    worker_rlimit_nofile 65535;
    error_log /var/log/nginx/error.log warn;
    pid /var/run/nginx.pid;
    
    events {
        worker_connections 10240;
        use epoll;
        multi_accept on;
    }
    
    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        
        # Logging
        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for" '
                        'rt=$request_time uct="$upstream_connect_time" '
                        'uht="$upstream_header_time" urt="$upstream_response_time"';
        
        access_log /var/log/nginx/access.log main;
        
        # Performance Optimizations
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        keepalive_requests 100;
        reset_timedout_connection on;
        client_body_timeout 10;
        send_timeout 10;
        
        # Buffer Sizes
        client_body_buffer_size 128k;
        client_max_body_size 10m;
        client_header_buffer_size 1k;
        large_client_header_buffers 4 8k;
        output_buffers 1 32k;
        postpone_output 1460;
        
        # Gzip Compression
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_types text/plain text/css text/xml text/javascript 
                   application/json application/javascript application/xml+rss 
                   application/rss+xml font/truetype font/opentype 
                   application/vnd.ms-fontobject image/svg+xml;
        gzip_disable "msie6";
        gzip_min_length 1000;
        gzip_buffers 16 8k;
        
        # Brotli Compression (if module available)
        # brotli on;
        # brotli_comp_level 6;
        # brotli_types text/plain text/css text/xml text/javascript 
        #              application/json application/javascript application/xml+rss;
        
        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        
        # HSTS (HTTP Strict Transport Security)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        
        # Content Security Policy
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.neobank.com; style-src 'self' 'unsafe-inline' https://cdn.neobank.com; img-src 'self' data: https: blob:; font-src 'self' data: https://cdn.neobank.com; connect-src 'self' https://api.neobank.com wss://api.neobank.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;
        
        # Cache Control for Static Assets
        map $sent_http_content_type $expires {
            default                    off;
            text/html                  epoch;
            text/css                   max;
            application/javascript     max;
            application/json           epoch;
            ~image/                    max;
            ~font/                     max;
        }
        
        expires $expires;
        
        # Rate Limiting
        limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
        limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;
        limit_conn_zone $binary_remote_addr zone=addr:10m;
        
        # Upstream (Next.js server)
        upstream nextjs {
            least_conn;
            server 127.0.0.1:3000 max_fails=3 fail_timeout=30s;
            keepalive 32;
        }
        
        # HTTP Server (redirect to HTTPS)
        server {
            listen 80 default_server;
            listen [::]:80 default_server;
            server_name _;
            
            # Health check endpoint (no redirect)
            location /health {
                access_log off;
                return 200 "healthy\n";
                add_header Content-Type text/plain;
            }
            
            # Redirect all other traffic to HTTPS
            location / {
                return 301 https://$host$request_uri;
            }
        }
        
        # HTTPS Server
        server {
            listen 443 ssl http2 default_server;
            listen [::]:443 ssl http2 default_server;
            server_name neobank.com www.neobank.com;
            
            # SSL Configuration
            ssl_certificate /etc/nginx/ssl/tls.crt;
            ssl_certificate_key /etc/nginx/ssl/tls.key;
            ssl_protocols TLSv1.2 TLSv1.3;
            ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
            ssl_prefer_server_ciphers off;
            ssl_session_cache shared:SSL:10m;
            ssl_session_timeout 10m;
            ssl_session_tickets off;
            ssl_stapling on;
            ssl_stapling_verify on;
            
            # Root directory
            root /app/.next;
            
            # Rate Limiting
            limit_req zone=general burst=20 nodelay;
            limit_conn addr 10;
            
            # Health Check
            location /health {
                access_log off;
                return 200 "healthy\n";
                add_header Content-Type text/plain;
            }
            
            # Static Assets (Next.js)
            location /_next/static/ {
                alias /app/.next/static/;
                expires 1y;
                access_log off;
                add_header Cache-Control "public, immutable";
            }
            
            # Public Assets
            location /static/ {
                alias /app/public/;
                expires 1y;
                access_log off;
                add_header Cache-Control "public, immutable";
            }
            
            # Images
            location /images/ {
                alias /app/public/images/;
                expires 30d;
                access_log off;
                add_header Cache-Control "public";
            }
            
            # Favicon
            location = /favicon.ico {
                alias /app/public/favicon.ico;
                expires 30d;
                access_log off;
            }
            
            # Robots.txt
            location = /robots.txt {
                alias /app/public/robots.txt;
                expires 7d;
                access_log off;
            }
            
            # Service Worker
            location = /sw.js {
                proxy_pass http://nextjs;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection 'upgrade';
                proxy_set_header Host $host;
                proxy_cache_bypass $http_upgrade;
                add_header Cache-Control "no-cache, no-store, must-revalidate";
                add_header Pragma "no-cache";
                add_header Expires "0";
            }
            
            # WebSocket Support (for hot reload in dev)
            location /_next/webpack-hmr {
                proxy_pass http://nextjs;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_set_header Host $host;
            }
            
            # Next.js Pages (SSR/SSG)
            location / {
                proxy_pass http://nextjs;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection 'upgrade';
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_cache_bypass $http_upgrade;
                proxy_buffering off;
                proxy_request_buffering off;
                
                # Timeouts
                proxy_connect_timeout 60s;
                proxy_send_timeout 60s;
                proxy_read_timeout 60s;
            }
        }
    }

---
# Frontend Secrets
apiVersion: v1
kind: Secret
metadata:
  name: frontend-secrets
  namespace: neobank-production
type: Opaque
stringData:
  # Analytics
  NEXT_PUBLIC_GA_MEASUREMENT_ID: "G-XXXXXXXXXX"
  
  # Sentry
  SENTRY_AUTH_TOKEN: "your_sentry_auth_token"
  
  # Session Secret
  SESSION_SECRET: "CHANGE_ME_SESSION_SECRET_32_CHARS"
  
  # NextAuth (if using)
  NEXTAUTH_SECRET: "CHANGE_ME_NEXTAUTH_SECRET_32_CHARS"
  NEXTAUTH_URL: "https://neobank.com"

---
# Frontend Deployment with High Availability
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-web
  namespace: neobank-production
  labels:
    app: frontend-web
    tier: frontend
    version: v1.0.0
spec:
  # High Availability: Start with 3 replicas, can scale to 15
  replicas: 3
  
  # Rolling Update Strategy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2              # Allow 2 extra pods during update
      maxUnavailable: 1        # Keep at least 2 pods running during update
  
  selector:
    matchLabels:
      app: frontend-web
      tier: frontend
  
  template:
    metadata:
      labels:
        app: frontend-web
        tier: frontend
        version: v1.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9113"
        prometheus.io/path: "/metrics"
    
    spec:
      # Pod Anti-Affinity: Spread pods across different nodes
      affinity:
        podAntiAffinity:
          # PREFERRED: Try to spread across different nodes
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - frontend-web
              topologyKey: kubernetes.io/hostname
          
          # PREFERRED: Spread across different availability zones
          - weight: 50
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - frontend-web
              topologyKey: topology.kubernetes.io/zone
      
      # Security Context
      securityContext:
        runAsNonRoot: true
        runAsUser: 101  # nginx user
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      
      # Init Container: Build optimization check
      initContainers:
      - name: check-backend-api
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          echo "Checking backend API availability..."
          until nc -z backend-api 8000; do
            echo "Waiting for backend API..."
            sleep 2
          done
          echo "Backend API is ready!"
      
      # Main Containers
      containers:
      # Next.js Application
      - name: nextjs
        image: neobank-frontend:v1.0.0
        imagePullPolicy: Always
        
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        
        # Environment Variables
        envFrom:
        - configMapRef:
            name: frontend-config
        - secretRef:
            name: frontend-secrets
        
        env:
        - name: PORT
          value: "3000"
        - name: HOSTNAME
          value: "0.0.0.0"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        
        # Resource Limits
        resources:
          requests:
            cpu: 500m           # 0.5 CPU core
            memory: 512Mi       # 512MB RAM
          limits:
            cpu: 1000m          # 1 CPU core max
            memory: 1Gi         # 1GB RAM max
        
        # Volume Mounts
        volumeMounts:
        - name: next-cache
          mountPath: /app/.next/cache
        - name: tmp
          mountPath: /tmp
        
        # Liveness Probe
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        # Readiness Probe
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        
        # Startup Probe
        startupProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 20  # 20 * 5s = 100s max startup time
        
        # Security Context
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
      
      # Nginx Reverse Proxy (for caching and performance)
      - name: nginx
        image: nginx:1.25-alpine
        
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
        - name: https
          containerPort: 443
          protocol: TCP
        
        # Resource Limits
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        
        # Volume Mounts
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        - name: nginx-cache
          mountPath: /var/cache/nginx
        - name: nginx-logs
          mountPath: /var/log/nginx
        - name: tls-certs
          mountPath: /etc/nginx/ssl
          readOnly: true
        
        # Liveness Probe
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        
        # Readiness Probe
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 2
        
        # Security Context
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 101  # nginx user
          capabilities:
            drop:
            - ALL
            add:
            - NET_BIND_SERVICE
      
      # Nginx Prometheus Exporter (for metrics)
      - name: nginx-exporter
        image: nginx/nginx-prometheus-exporter:0.11
        args:
        - -nginx.scrape-uri=http://localhost:80/nginx_status
        
        ports:
        - name: metrics
          containerPort: 9113
          protocol: TCP
        
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
        
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65534
          capabilities:
            drop:
            - ALL
      
      # Volumes
      volumes:
      - name: nginx-config
        configMap:
          name: frontend-config
          items:
          - key: nginx.conf
            path: nginx.conf
      - name: nginx-cache
        emptyDir:
          sizeLimit: 1Gi
      - name: nginx-logs
        emptyDir:
          sizeLimit: 500Mi
      - name: next-cache
        emptyDir:
          sizeLimit: 2Gi
      - name: tmp
        emptyDir:
          sizeLimit: 500Mi
      - name: tls-certs
        secret:
          secretName: frontend-tls
          optional: true
      
      # DNS Configuration
      dnsPolicy: ClusterFirst
      
      # Restart Policy
      restartPolicy: Always
      
      # Termination Grace Period
      terminationGracePeriodSeconds: 30

---
# Frontend Service (ClusterIP)
apiVersion: v1
kind: Service
metadata:
  name: frontend-web
  namespace: neobank-production
  labels:
    app: frontend-web
    tier: frontend
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9113"
spec:
  type: ClusterIP
  selector:
    app: frontend-web
    tier: frontend
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
  - name: https
    port: 443
    targetPort: 443
    protocol: TCP
  - name: metrics
    port: 9113
    targetPort: 9113
    protocol: TCP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600  # 1 hour

---
# Frontend Service (NodePort for external access)
apiVersion: v1
kind: Service
metadata:
  name: frontend-web-external
  namespace: neobank-production
  labels:
    app: frontend-web
    tier: frontend
spec:
  type: NodePort
  selector:
    app: frontend-web
    tier: frontend
  ports:
  - name: http
    port: 80
    targetPort: 80
    nodePort: 30080
    protocol: TCP
  - name: https
    port: 443
    targetPort: 443
    nodePort: 30443
    protocol: TCP

---
# Horizontal Pod Autoscaler (HPA)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend-web-hpa
  namespace: neobank-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend-web
  
  # Scaling Configuration
  minReplicas: 3              # Minimum 3 pods for HA
  maxReplicas: 15             # Maximum 15 pods under high load
  
  # Scaling Behavior
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300    # Wait 5 minutes before scaling down
      policies:
      - type: Percent
        value: 20                         # Scale down max 20% at a time
        periodSeconds: 60
      - type: Pods
        value: 2                          # Or max 2 pods at a time
        periodSeconds: 60
      selectPolicy: Min
    
    scaleUp:
      stabilizationWindowSeconds: 0       # Scale up immediately
      policies:
      - type: Percent
        value: 100                        # Scale up max 100% at a time
        periodSeconds: 60
      - type: Pods
        value: 4                          # Or max 4 pods at a time
        periodSeconds: 60
      selectPolicy: Max
  
  # Metrics for Auto-Scaling
  metrics:
  # CPU-based scaling
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60           # Scale up if CPU > 60%
  
  # Memory-based scaling
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 70           # Scale up if memory > 70%

---
# Pod Disruption Budget (PDB)
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend-web-pdb
  namespace: neobank-production
spec:
  minAvailable: 2              # Always keep at least 2 pods running
  selector:
    matchLabels:
      app: frontend-web
      tier: frontend

---
# Ingress with CDN Configuration
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-web-ingress
  namespace: neobank-production
  annotations:
    # Ingress Class
    kubernetes.io/ingress.class: "nginx"
    
    # SSL/TLS
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    
    # Performance
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/proxy-buffering: "on"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "8k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
    
    # Caching
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "Cache-Control: public, max-age=31536000, immutable" if ($uri ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$);
      more_set_headers "Cache-Control: no-cache, no-store, must-revalidate" if ($uri ~* \.(html)$);
    
    # Compression
    nginx.ingress.kubernetes.io/enable-brotli: "true"
    nginx.ingress.kubernetes.io/brotli-level: "6"
    
    # Rate Limiting
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-connections: "20"
    
    # Timeouts
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    
    # CDN Integration (CloudFlare example)
    nginx.ingress.kubernetes.io/server-snippet: |
      # CloudFlare CDN headers
      add_header X-CDN-Cache-Status $upstream_cache_status;
      add_header X-CDN-Request-ID $request_id;
      
      # Vary header for CDN
      add_header Vary "Accept-Encoding, Accept";
spec:
  tls:
  - hosts:
    - neobank.com
    - www.neobank.com
    - app.neobank.com
    secretName: frontend-tls
  
  rules:
  # Main domain
  - host: neobank.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-web
            port:
              number: 80
  
  # WWW subdomain
  - host: www.neobank.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-web
            port:
              number: 80
  
  # App subdomain
  - host: app.neobank.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-web
            port:
              number: 80

---
# CDN Configuration (CloudFlare Workers or similar)
apiVersion: v1
kind: ConfigMap
metadata:
  name: cdn-config
  namespace: neobank-production
data:
  # CloudFlare Page Rules (to be configured in CloudFlare dashboard)
  cloudflare-rules.yaml: |
    # Cache Everything for static assets
    - pattern: "*.neobank.com/_next/static/*"
      cache_level: cache_everything
      edge_cache_ttl: 31536000  # 1 year
      browser_cache_ttl: 31536000
    
    - pattern: "*.neobank.com/static/*"
      cache_level: cache_everything
      edge_cache_ttl: 31536000
      browser_cache_ttl: 31536000
    
    - pattern: "*.neobank.com/images/*"
      cache_level: cache_everything
      edge_cache_ttl: 2592000  # 30 days
      browser_cache_ttl: 2592000
    
    # Bypass cache for HTML pages
    - pattern: "*.neobank.com/*.html"
      cache_level: bypass
    
    # Bypass cache for API calls
    - pattern: "*.neobank.com/api/*"
      cache_level: bypass
  
  # CDN Purge Script
  cdn-purge.sh: |
    #!/bin/bash
    # Purge CDN cache after deployment
    
    # CloudFlare example
    curl -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
      -H "Authorization: Bearer ${CF_API_TOKEN}" \
      -H "Content-Type: application/json" \
      --data '{"purge_everything":true}'
    
    echo "CDN cache purged successfully"

---
# Service Monitor (for Prometheus)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: frontend-web-monitor
  namespace: neobank-production
  labels:
    app: frontend-web
    prometheus: kube-prometheus
spec:
  selector:
    matchLabels:
      app: frontend-web
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics
    scheme: http

---
# Network Policy (Security)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-web-network-policy
  namespace: neobank-production
spec:
  podSelector:
    matchLabels:
      app: frontend-web
  policyTypes:
  - Ingress
  - Egress
  
  # Ingress: Allow from ingress controller and monitoring
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    - podSelector:
        matchLabels:
          app: prometheus
    ports:
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 9113
  
  # Egress: Allow to backend API, DNS, and external CDN
  egress:
  # DNS
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
    ports:
    - protocol: UDP
      port: 53
  
  # Backend API
  - to:
    - podSelector:
        matchLabels:
          app: backend-api
    ports:
    - protocol: TCP
      port: 8000
  
  # External HTTPS (for CDN, analytics, etc.)
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443

---
# Deployment Summary
# ====================
# 
# High Availability Features:
# ✅ 3 replicas minimum (scales to 15 under load)
# ✅ Pod anti-affinity (spread across nodes and AZs)
# ✅ Nginx reverse proxy for caching and performance
# ✅ CDN integration (CloudFlare or similar)
# ✅ Brotli/Gzip compression
# ✅ Static asset caching (1 year)
# ✅ SSL/TLS termination
# ✅ Rate limiting (100 req/s per IP)
# ✅ Auto-scaling (CPU > 60%, Memory > 70%)
# ✅ Health checks (liveness, readiness, startup)
# ✅ Prometheus monitoring
# ✅ Security headers (CSP, HSTS, X-Frame-Options)
# ✅ Session affinity (1 hour)
# 
# Performance Optimizations:
# ✅ Next.js static optimization
# ✅ Image optimization
# ✅ Code splitting
# ✅ Tree shaking
# ✅ Service Worker (PWA)
# ✅ HTTP/2 support
# ✅ Connection keep-alive
# ✅ Buffer optimization
# 
# CDN Configuration:
# ✅ CloudFlare integration
# ✅ Edge caching (static assets: 1 year)
# ✅ Cache purging on deployment
# ✅ Vary headers for proper caching
# ✅ Cache bypass for HTML/API
# 
# Resource Requirements per Pod:
# - Next.js: CPU 0.5-1 core, Memory 512MB-1GB
# - Nginx: CPU 0.2-0.5 core, Memory 256MB-512MB
# - Exporter: CPU 0.05-0.1 core, Memory 64MB-128MB
# 
# Total per Pod: CPU 0.75-1.6 cores, Memory 832MB-1.6GB
# 
# Total Cluster (3 pods):
# - CPU: 2.25-4.8 cores
# - Memory: 2.5GB-4.8GB
# 
# Deployment Commands:
# ====================
# 
# 1. Deploy:
#    kubectl apply -f FRONTEND_WEB_HA_DEPLOYMENT.yaml
# 
# 2. Verify:
#    kubectl get pods -n neobank-production -l app=frontend-web
#    kubectl get hpa -n neobank-production
#    kubectl get ingress -n neobank-production
# 
# 3. Test:
#    curl https://neobank.com
#    curl https://neobank.com/health
# 
# 4. Monitor:
#    kubectl logs -f deployment/frontend-web -c nextjs -n neobank-production
#    kubectl logs -f deployment/frontend-web -c nginx -n neobank-production
# 
# 5. Scale:
#    kubectl scale deployment frontend-web --replicas=10 -n neobank-production
# 
# 6. Update:
#    kubectl set image deployment/frontend-web nextjs=neobank-frontend:v1.1.0 -n neobank-production
#    kubectl rollout status deployment/frontend-web -n neobank-production
