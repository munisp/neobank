---
# Pod Disruption Budgets for all Go services
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: go-services-pdb
  namespace: neobank-production
spec:
  minAvailable: 2
  selector:
    matchLabels:
      tier: backend

---
# Network Policy for Go services
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: go-services-network-policy
  namespace: neobank-production
spec:
  podSelector:
    matchLabels:
      tier: backend
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: backend-api
    - podSelector:
        matchLabels:
          app: apisix-gateway
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: postgresql-primary
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - podSelector:
        matchLabels:
          app: redis-cluster
    ports:
    - protocol: TCP
      port: 6379
  - to:
    - podSelector:
        matchLabels:
          app: kafka
    ports:
    - protocol: TCP
      port: 9092
  - to:
    - podSelector:
        matchLabels:
          app: tigerbeetle
    ports:
    - protocol: TCP
      port: 3000
