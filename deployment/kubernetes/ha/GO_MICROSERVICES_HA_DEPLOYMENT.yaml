# NeoBank Go Microservices - High Availability Kubernetes Deployment
# Production-Ready Configuration for all 12 Go services
# Version: 1.0.0

---
# KYC/KYB Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kyc-kyb-go
  namespace: neobank-production
  labels:
    app: kyc-kyb-go
    tier: backend
    version: v1.0.0
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: kyc-kyb-go
  template:
    metadata:
      labels:
        app: kyc-kyb-go
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: kyc-kyb-go
              topologyKey: kubernetes.io/hostname
      containers:
      - name: kyc-kyb-go
        image: neobank/kyc-kyb-go:v1.0.0
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        - name: POSTGRES_HOST
          value: "postgresql-primary"
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_DB
          value: "neobank_production"
        - name: KAFKA_BROKERS
          value: "kafka-headless:9092"
        - name: KAFKA_ENABLED
          value: "true"
        envFrom:
        - secretRef:
            name: backend-api-secrets
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: kyc-kyb-go
  namespace: neobank-production
spec:
  selector:
    app: kyc-kyb-go
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kyc-kyb-go-hpa
  namespace: neobank-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kyc-kyb-go
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70

