---
# OpenAppSec High Availability Web Application Firewall Configuration
# Production-ready OpenAppSec WAF with ML-based threat detection
# Version: 1.0.0

apiVersion: v1
kind: Namespace
metadata:
  name: openappsec
  labels:
    name: openappsec
    environment: production

---
# OpenAppSec ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: openappsec-config
  namespace: openappsec
data:
  local_policy.yaml: |
    policies:
      - name: neobank-waf-policy
        mode: prevent-learn
        practices:
          - web-attacks:
              override-mode: prevent-learn
              minimum-confidence: medium
              max-body-size-kb: 1000000
              max-header-size-bytes: 102400
              max-object-depth: 40
              max-url-size-bytes: 32768
          - anti-bot:
              override-mode: prevent-learn
              injected-URIs:
                - "/"
              validated-URIs:
                - "/"
          - snort-signatures:
              override-mode: detect
              files:
                - "/etc/cp/conf/snort3-community-rules/snort3-community.rules"
        triggers:
          - log:
              verbosity: extended
              extendedLogging: true
              responseBody: true
              responseCode: true
              cef-format: false
              syslog:
                - address: "fluentd.logging:24224"
                  port: 24224
          - web-user-response:
              mode: block-page
              response-body: "Access Denied - Your request has been blocked by the security system."
              response-title: "Access Denied"
              response-code: 403
        custom-response:
          mode: response-code-only
          http-response-code: 403
        exceptions:
          - name: health-checks
            match:
              - uri: "/health"
              - uri: "/ready"
              - uri: "/metrics"
            action: accept
          - name: internal-services
            match:
              - sourceip: "10.0.0.0/8"
              - sourceip: "172.16.0.0/12"
              - sourceip: "192.168.0.0/16"
            action: accept
    
    settings:
      agent-settings:
        fog:
          fog-address: "https://inext-agents.cloud.ngen.checkpoint.com"
        agent:
          eventBuffer:
            maxSizeOnDiskInMB: 100
            maxSizeInMemoryInKB: 1000
        orchestration:
          orchestration-mode: online_mode
      
    log:
      streams:
        - name: syslog-stream
          type: syslog
          address: fluentd.logging
          port: 24224
          protocol: tcp
        - name: stdout-stream
          type: stdout

---
# OpenAppSec Secrets
apiVersion: v1
kind: Secret
metadata:
  name: openappsec-secrets
  namespace: openappsec
type: Opaque
stringData:
  agent-token: CHANGE_ME_OPENAPPSEC_AGENT_TOKEN

---
# OpenAppSec DaemonSet (runs on every node for HA)
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: openappsec-agent
  namespace: openappsec
  labels:
    app: openappsec-agent
spec:
  selector:
    matchLabels:
      app: openappsec-agent
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: openappsec-agent
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8888"
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - key: node-role.kubernetes.io/master
          effect: NoSchedule
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
      containers:
        - name: openappsec-agent
          image: ghcr.io/openappsec/agent:latest
          securityContext:
            privileged: true
            capabilities:
              add:
                - NET_ADMIN
                - SYS_PTRACE
          ports:
            - containerPort: 8888
              name: metrics
              hostPort: 8888
          env:
            - name: AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openappsec-secrets
                  key: agent-token
            - name: LEARNING_MODE
              value: "true"
            - name: LOG_LEVEL
              value: "info"
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8888
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8888
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/cp/conf/local_policy.yaml
              subPath: local_policy.yaml
            - name: logs
              mountPath: /var/log/nano_agent
      volumes:
        - name: config
          configMap:
            name: openappsec-config
        - name: logs
          hostPath:
            path: /var/log/openappsec
            type: DirectoryOrCreate

---
# OpenAppSec Standalone Deployment (for centralized management)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openappsec-standalone
  namespace: openappsec
  labels:
    app: openappsec-standalone
spec:
  replicas: 3
  selector:
    matchLabels:
      app: openappsec-standalone
  template:
    metadata:
      labels:
        app: openappsec-standalone
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8888"
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - openappsec-standalone
              topologyKey: kubernetes.io/hostname
      containers:
        - name: openappsec
          image: ghcr.io/openappsec/standalone:latest
          ports:
            - containerPort: 80
              name: http
            - containerPort: 443
              name: https
            - containerPort: 8888
              name: metrics
          env:
            - name: AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openappsec-secrets
                  key: agent-token
            - name: LEARNING_MODE
              value: "true"
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8888
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8888
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/cp/conf/local_policy.yaml
              subPath: local_policy.yaml
      volumes:
        - name: config
          configMap:
            name: openappsec-config

---
# OpenAppSec Service
apiVersion: v1
kind: Service
metadata:
  name: openappsec
  namespace: openappsec
  labels:
    app: openappsec-standalone
spec:
  selector:
    app: openappsec-standalone
  ports:
    - port: 80
      targetPort: 80
      name: http
    - port: 443
      targetPort: 443
      name: https
  type: LoadBalancer

---
# OpenAppSec Metrics Service
apiVersion: v1
kind: Service
metadata:
  name: openappsec-metrics
  namespace: openappsec
  labels:
    app: openappsec-standalone
spec:
  selector:
    app: openappsec-standalone
  ports:
    - port: 8888
      targetPort: 8888
      name: metrics
  type: ClusterIP

---
# PodDisruptionBudget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: openappsec-pdb
  namespace: openappsec
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: openappsec-standalone

---
# HorizontalPodAutoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: openappsec-hpa
  namespace: openappsec
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: openappsec-standalone
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
# ServiceMonitor for Prometheus
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: openappsec-monitor
  namespace: openappsec
  labels:
    prometheus: kube-prometheus
spec:
  selector:
    matchLabels:
      app: openappsec-standalone
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics

---
# NetworkPolicy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openappsec-network-policy
  namespace: openappsec
spec:
  podSelector:
    matchLabels:
      app: openappsec-standalone
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              name: logging
      ports:
        - protocol: TCP
          port: 24224
