---
# Fluvio High Availability Streaming Platform Configuration
# Production-ready Fluvio cluster for real-time data streaming
# Version: 1.0.0

apiVersion: v1
kind: Namespace
metadata:
  name: fluvio
  labels:
    name: fluvio
    environment: production

---
# Fluvio SC (Streaming Controller) StatefulSet - HA
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fluvio-sc
  namespace: fluvio
  labels:
    app: fluvio-sc
spec:
  serviceName: fluvio-sc-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: fluvio-sc
  template:
    metadata:
      labels:
        app: fluvio-sc
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9003"
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - fluvio-sc
              topologyKey: kubernetes.io/hostname
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - fluvio-sc
                topologyKey: topology.kubernetes.io/zone
      containers:
        - name: fluvio-sc
          image: infinyon/fluvio:0.11.0
          args:
            - "run"
            - "sc"
            - "--bind-public"
            - "0.0.0.0:9003"
            - "--bind-private"
            - "0.0.0.0:9004"
          ports:
            - containerPort: 9003
              name: public
            - containerPort: 9004
              name: private
          env:
            - name: RUST_LOG
              value: "info"
            - name: FLV_SC_PRIVATE_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          livenessProbe:
            tcpSocket:
              port: 9003
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 9003
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/fluvio
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: fast-ssd
        resources:
          requests:
            storage: 20Gi

---
# Fluvio SPU (Streaming Processing Unit) StatefulSet - HA
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fluvio-spu
  namespace: fluvio
  labels:
    app: fluvio-spu
spec:
  serviceName: fluvio-spu-headless
  replicas: 5
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: fluvio-spu
  template:
    metadata:
      labels:
        app: fluvio-spu
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9005"
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - fluvio-spu
              topologyKey: kubernetes.io/hostname
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - fluvio-spu
                topologyKey: topology.kubernetes.io/zone
      containers:
        - name: fluvio-spu
          image: infinyon/fluvio:0.11.0
          args:
            - "run"
            - "spu"
            - "--sc-addr"
            - "fluvio-sc:9004"
            - "--bind-public"
            - "0.0.0.0:9005"
            - "--bind-private"
            - "0.0.0.0:9006"
          ports:
            - containerPort: 9005
              name: public
            - containerPort: 9006
              name: private
          env:
            - name: RUST_LOG
              value: "info"
            - name: FLV_SPU_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 1000m
              memory: 1Gi
            limits:
              cpu: 4000m
              memory: 4Gi
          livenessProbe:
            tcpSocket:
              port: 9005
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 9005
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/fluvio
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: fast-ssd
        resources:
          requests:
            storage: 100Gi

---
# Fluvio SC Service
apiVersion: v1
kind: Service
metadata:
  name: fluvio-sc
  namespace: fluvio
spec:
  selector:
    app: fluvio-sc
  ports:
    - port: 9003
      targetPort: 9003
      name: public
    - port: 9004
      targetPort: 9004
      name: private
  type: ClusterIP

---
# Fluvio SC Headless Service
apiVersion: v1
kind: Service
metadata:
  name: fluvio-sc-headless
  namespace: fluvio
spec:
  clusterIP: None
  selector:
    app: fluvio-sc
  ports:
    - port: 9003
      targetPort: 9003
      name: public
    - port: 9004
      targetPort: 9004
      name: private

---
# Fluvio SPU Headless Service
apiVersion: v1
kind: Service
metadata:
  name: fluvio-spu-headless
  namespace: fluvio
spec:
  clusterIP: None
  selector:
    app: fluvio-spu
  ports:
    - port: 9005
      targetPort: 9005
      name: public
    - port: 9006
      targetPort: 9006
      name: private

---
# PodDisruptionBudget for Fluvio SC
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: fluvio-sc-pdb
  namespace: fluvio
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: fluvio-sc

---
# PodDisruptionBudget for Fluvio SPU
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: fluvio-spu-pdb
  namespace: fluvio
spec:
  minAvailable: 3
  selector:
    matchLabels:
      app: fluvio-spu

---
# HorizontalPodAutoscaler for Fluvio SPU
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fluvio-spu-hpa
  namespace: fluvio
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: fluvio-spu
  minReplicas: 5
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60

---
# ServiceMonitor for Prometheus
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: fluvio-monitor
  namespace: fluvio
  labels:
    prometheus: kube-prometheus
spec:
  selector:
    matchLabels:
      app: fluvio-sc
  endpoints:
    - port: public
      interval: 30s
      path: /metrics
