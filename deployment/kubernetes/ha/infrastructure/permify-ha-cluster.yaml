---
# Permify High Availability Authorization Service Configuration
# Production-ready Permify for fine-grained authorization
# Version: 1.0.0

apiVersion: v1
kind: Namespace
metadata:
  name: permify
  labels:
    name: permify
    environment: production

---
# Permify ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: permify-config
  namespace: permify
data:
  config.yaml: |
    server:
      http:
        enabled: true
        port: 3476
      grpc:
        enabled: true
        port: 3478
      rate_limit: 1000
    logger:
      level: info
      output: stdout
    profiler:
      enabled: true
      port: 6060
    authn:
      enabled: true
      method: preshared
      preshared:
        keys:
          - PERMIFY_PRESHARED_KEY
    tracer:
      enabled: true
      exporter: otlp
      endpoint: otel-collector.monitoring:4317
      insecure: true
    meter:
      enabled: true
      exporter: otlp
      endpoint: otel-collector.monitoring:4317
    service:
      circuit_breaker: true
      watch:
        enabled: true
      schema:
        cache:
          number_of_counters: 10000
          max_cost: 10485760
      permission:
        bulk_limit: 100
        concurrency_limit: 100
      relationship:
        pool_size: 8
    database:
      engine: postgres
      uri: postgres://permify_user:CHANGE_ME_PERMIFY_PASSWORD@postgresql-primary.database:5432/permify?sslmode=require
      auto_migrate: true
      max_open_connections: 20
      max_idle_connections: 5
      max_connection_lifetime: 300s
      max_connection_idle_time: 60s
      garbage_collection:
        enabled: true
        interval: 3h
        window: 720h
        timeout: 5m
    distributed:
      enabled: true
      address: permify-headless.permify.svc.cluster.local:5053
      port: 5053

---
# Permify Secrets
apiVersion: v1
kind: Secret
metadata:
  name: permify-secrets
  namespace: permify
type: Opaque
stringData:
  PERMIFY_PRESHARED_KEY: CHANGE_ME_PERMIFY_PRESHARED_KEY
  DATABASE_URI: postgres://permify_user:CHANGE_ME_PERMIFY_PASSWORD@postgresql-primary.database:5432/permify?sslmode=require

---
# Permify StatefulSet (HA)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: permify
  namespace: permify
  labels:
    app: permify
spec:
  serviceName: permify-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: permify
  template:
    metadata:
      labels:
        app: permify
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3476"
        prometheus.io/path: "/metrics"
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - permify
              topologyKey: kubernetes.io/hostname
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - permify
                topologyKey: topology.kubernetes.io/zone
      containers:
        - name: permify
          image: ghcr.io/permify/permify:v0.8.0
          args:
            - serve
            - --config=/etc/permify/config.yaml
          ports:
            - containerPort: 3476
              name: http
            - containerPort: 3478
              name: grpc
            - containerPort: 5053
              name: distributed
            - containerPort: 6060
              name: profiler
          env:
            - name: PERMIFY_PRESHARED_KEY
              valueFrom:
                secretKeyRef:
                  name: permify-secrets
                  key: PERMIFY_PRESHARED_KEY
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3476
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3476
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/permify
      volumes:
        - name: config
          configMap:
            name: permify-config

---
# Permify Service
apiVersion: v1
kind: Service
metadata:
  name: permify
  namespace: permify
  labels:
    app: permify
spec:
  selector:
    app: permify
  ports:
    - port: 3476
      targetPort: 3476
      name: http
    - port: 3478
      targetPort: 3478
      name: grpc
  type: ClusterIP

---
# Permify Headless Service (for clustering)
apiVersion: v1
kind: Service
metadata:
  name: permify-headless
  namespace: permify
  labels:
    app: permify
spec:
  clusterIP: None
  selector:
    app: permify
  ports:
    - port: 3476
      targetPort: 3476
      name: http
    - port: 3478
      targetPort: 3478
      name: grpc
    - port: 5053
      targetPort: 5053
      name: distributed

---
# PodDisruptionBudget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: permify-pdb
  namespace: permify
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: permify

---
# HorizontalPodAutoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: permify-hpa
  namespace: permify
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: permify
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
# ServiceMonitor for Prometheus
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: permify-monitor
  namespace: permify
  labels:
    prometheus: kube-prometheus
spec:
  selector:
    matchLabels:
      app: permify
  endpoints:
    - port: http
      interval: 30s
      path: /metrics

---
# NetworkPolicy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: permify-network-policy
  namespace: permify
spec:
  podSelector:
    matchLabels:
      app: permify
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: neobank-production
      ports:
        - protocol: TCP
          port: 3476
        - protocol: TCP
          port: 3478
    - from:
        - podSelector:
            matchLabels:
              app: permify
      ports:
        - protocol: TCP
          port: 5053
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: database
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - protocol: TCP
          port: 4317
