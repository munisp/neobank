---
# TigerBeetle High Availability Financial Ledger Configuration
# Production-ready TigerBeetle cluster for financial transactions
# Version: 1.0.0

apiVersion: v1
kind: Namespace
metadata:
  name: tigerbeetle
  labels:
    name: tigerbeetle
    environment: production

---
# TigerBeetle ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: tigerbeetle-config
  namespace: tigerbeetle
data:
  cluster-id: "0"
  replica-count: "6"
  addresses: |
    tigerbeetle-0.tigerbeetle-headless.tigerbeetle.svc.cluster.local:3001
    tigerbeetle-1.tigerbeetle-headless.tigerbeetle.svc.cluster.local:3001
    tigerbeetle-2.tigerbeetle-headless.tigerbeetle.svc.cluster.local:3001
    tigerbeetle-3.tigerbeetle-headless.tigerbeetle.svc.cluster.local:3001
    tigerbeetle-4.tigerbeetle-headless.tigerbeetle.svc.cluster.local:3001
    tigerbeetle-5.tigerbeetle-headless.tigerbeetle.svc.cluster.local:3001

---
# TigerBeetle StatefulSet (HA - 6 replicas for consensus)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tigerbeetle
  namespace: tigerbeetle
  labels:
    app: tigerbeetle
spec:
  serviceName: tigerbeetle-headless
  replicas: 6
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: tigerbeetle
  template:
    metadata:
      labels:
        app: tigerbeetle
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3002"
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - tigerbeetle
              topologyKey: kubernetes.io/hostname
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - tigerbeetle
                topologyKey: topology.kubernetes.io/zone
      terminationGracePeriodSeconds: 120
      initContainers:
        - name: init-tigerbeetle
          image: ghcr.io/tigerbeetle/tigerbeetle:0.15.3
          command:
            - sh
            - -c
            - |
              REPLICA_INDEX=${HOSTNAME##*-}
              if [ ! -f /data/0_${REPLICA_INDEX}.tigerbeetle ]; then
                echo "Formatting TigerBeetle data file for replica ${REPLICA_INDEX}..."
                /tigerbeetle format --cluster=0 --replica=${REPLICA_INDEX} --replica-count=6 /data/0_${REPLICA_INDEX}.tigerbeetle
              else
                echo "TigerBeetle data file already exists for replica ${REPLICA_INDEX}"
              fi
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            runAsUser: 0
      containers:
        - name: tigerbeetle
          image: ghcr.io/tigerbeetle/tigerbeetle:0.15.3
          command:
            - sh
            - -c
            - |
              REPLICA_INDEX=${HOSTNAME##*-}
              ADDRESSES="tigerbeetle-0.tigerbeetle-headless.tigerbeetle.svc.cluster.local:3001,tigerbeetle-1.tigerbeetle-headless.tigerbeetle.svc.cluster.local:3001,tigerbeetle-2.tigerbeetle-headless.tigerbeetle.svc.cluster.local:3001,tigerbeetle-3.tigerbeetle-headless.tigerbeetle.svc.cluster.local:3001,tigerbeetle-4.tigerbeetle-headless.tigerbeetle.svc.cluster.local:3001,tigerbeetle-5.tigerbeetle-headless.tigerbeetle.svc.cluster.local:3001"
              exec /tigerbeetle start --addresses=${ADDRESSES} /data/0_${REPLICA_INDEX}.tigerbeetle
          ports:
            - containerPort: 3001
              name: tigerbeetle
            - containerPort: 3002
              name: metrics
          resources:
            requests:
              cpu: 2000m
              memory: 4Gi
            limits:
              cpu: 8000m
              memory: 16Gi
          livenessProbe:
            tcpSocket:
              port: 3001
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            runAsUser: 0
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: fast-ssd
        resources:
          requests:
            storage: 100Gi

---
# TigerBeetle Service
apiVersion: v1
kind: Service
metadata:
  name: tigerbeetle
  namespace: tigerbeetle
  labels:
    app: tigerbeetle
spec:
  selector:
    app: tigerbeetle
  ports:
    - port: 3001
      targetPort: 3001
      name: tigerbeetle
  type: ClusterIP

---
# TigerBeetle Headless Service
apiVersion: v1
kind: Service
metadata:
  name: tigerbeetle-headless
  namespace: tigerbeetle
  labels:
    app: tigerbeetle
spec:
  clusterIP: None
  selector:
    app: tigerbeetle
  ports:
    - port: 3001
      targetPort: 3001
      name: tigerbeetle

---
# TigerBeetle Client Service (Load Balanced)
apiVersion: v1
kind: Service
metadata:
  name: tigerbeetle-client
  namespace: tigerbeetle
  labels:
    app: tigerbeetle
spec:
  selector:
    app: tigerbeetle
  ports:
    - port: 3001
      targetPort: 3001
      name: tigerbeetle
  type: ClusterIP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800

---
# PodDisruptionBudget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: tigerbeetle-pdb
  namespace: tigerbeetle
spec:
  minAvailable: 4
  selector:
    matchLabels:
      app: tigerbeetle

---
# ServiceMonitor for Prometheus
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: tigerbeetle-monitor
  namespace: tigerbeetle
  labels:
    prometheus: kube-prometheus
spec:
  selector:
    matchLabels:
      app: tigerbeetle
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics

---
# NetworkPolicy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tigerbeetle-network-policy
  namespace: tigerbeetle
spec:
  podSelector:
    matchLabels:
      app: tigerbeetle
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: neobank-production
      ports:
        - protocol: TCP
          port: 3001
    - from:
        - podSelector:
            matchLabels:
              app: tigerbeetle
      ports:
        - protocol: TCP
          port: 3001
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: tigerbeetle
      ports:
        - protocol: TCP
          port: 3001

---
# TigerBeetle Backup CronJob
apiVersion: batch/v1
kind: CronJob
metadata:
  name: tigerbeetle-backup
  namespace: tigerbeetle
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: amazon/aws-cli:2.13.0
              command:
                - sh
                - -c
                - |
                  TIMESTAMP=$(date +%Y%m%d_%H%M%S)
                  for i in 0 1 2 3 4 5; do
                    kubectl cp tigerbeetle/tigerbeetle-${i}:/data/0_${i}.tigerbeetle /tmp/backup_${i}.tigerbeetle
                    aws s3 cp /tmp/backup_${i}.tigerbeetle s3://neobank-backups/tigerbeetle/${TIMESTAMP}/0_${i}.tigerbeetle
                  done
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: aws-credentials
                      key: access-key-id
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: aws-credentials
                      key: secret-access-key
                - name: AWS_DEFAULT_REGION
                  value: us-east-1
