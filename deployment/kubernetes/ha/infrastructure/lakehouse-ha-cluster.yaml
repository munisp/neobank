---
# Lakehouse High Availability Data Platform Configuration
# Production-ready Apache Iceberg + Spark + Trino data lakehouse
# Version: 1.0.0

apiVersion: v1
kind: Namespace
metadata:
  name: lakehouse
  labels:
    name: lakehouse
    environment: production

---
# RustFS Object Storage StatefulSet (S3-compatible storage for Iceberg)
# RustFS is 2.3x faster than MinIO for small objects, Apache 2.0 licensed
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rustfs
  namespace: lakehouse
  labels:
    app: rustfs
spec:
  serviceName: rustfs-headless
  replicas: 4
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: rustfs
  template:
    metadata:
      labels:
        app: rustfs
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9000"
        prometheus.io/path: "/metrics"
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - rustfs
              topologyKey: kubernetes.io/hostname
      securityContext:
        fsGroup: 10001
        runAsUser: 10001
        runAsGroup: 10001
      initContainers:
        - name: init-permissions
          image: busybox:latest
          command:
            - sh
            - -c
            - |
              for i in 0 1 2 3; do
                mkdir -p /data/rustfs$i
              done
              mkdir -p /logs
              chown -R 10001:10001 /data /logs
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: data-rustfs-0
              mountPath: /data/rustfs0
            - name: data-rustfs-1
              mountPath: /data/rustfs1
            - name: data-rustfs-2
              mountPath: /data/rustfs2
            - name: data-rustfs-3
              mountPath: /data/rustfs3
            - name: logs
              mountPath: /logs
      containers:
        - name: rustfs
          image: rustfs/rustfs:latest
          command: ["/usr/bin/rustfs"]
          ports:
            - containerPort: 9000
              name: api
            - containerPort: 9001
              name: console
          env:
            - name: RUSTFS_VOLUMES
              value: "http://rustfs-{0...3}.rustfs-headless.lakehouse.svc.cluster.local:9000/data/rustfs{0...3}"
            - name: RUSTFS_ADDRESS
              value: "0.0.0.0:9000"
            - name: RUSTFS_CONSOLE_ADDRESS
              value: "0.0.0.0:9001"
            - name: RUSTFS_CONSOLE_ENABLE
              value: "true"
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-secrets
                  key: access-key
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-secrets
                  key: secret-key
            - name: RUSTFS_CORS_ALLOWED_ORIGINS
              value: "*"
            - name: RUSTFS_OBS_LOGGER_LEVEL
              value: "info"
            - name: RUSTFS_REGION
              value: "us-east-1"
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - name: data-rustfs-0
              mountPath: /data/rustfs0
            - name: data-rustfs-1
              mountPath: /data/rustfs1
            - name: data-rustfs-2
              mountPath: /data/rustfs2
            - name: data-rustfs-3
              mountPath: /data/rustfs3
            - name: logs
              mountPath: /logs
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data-rustfs-0
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: fast-ssd
        resources:
          requests:
            storage: 125Gi
    - metadata:
        name: data-rustfs-1
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: fast-ssd
        resources:
          requests:
            storage: 125Gi
    - metadata:
        name: data-rustfs-2
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: fast-ssd
        resources:
          requests:
            storage: 125Gi
    - metadata:
        name: data-rustfs-3
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: fast-ssd
        resources:
          requests:
            storage: 125Gi
    - metadata:
        name: logs
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: fast-ssd
        resources:
          requests:
            storage: 10Gi

---
# RustFS Secrets
apiVersion: v1
kind: Secret
metadata:
  name: rustfs-secrets
  namespace: lakehouse
type: Opaque
stringData:
  access-key: CHANGE_ME_RUSTFS_ACCESS_KEY
  secret-key: CHANGE_ME_RUSTFS_SECRET_KEY

---
# RustFS Service
apiVersion: v1
kind: Service
metadata:
  name: rustfs
  namespace: lakehouse
spec:
  selector:
    app: rustfs
  ports:
    - port: 9000
      targetPort: 9000
      name: api
    - port: 9001
      targetPort: 9001
      name: console
  type: ClusterIP

---
# RustFS Headless Service
apiVersion: v1
kind: Service
metadata:
  name: rustfs-headless
  namespace: lakehouse
spec:
  clusterIP: None
  selector:
    app: rustfs
  ports:
    - port: 9000
      targetPort: 9000
      name: api

---
# Hive Metastore ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: hive-metastore-config
  namespace: lakehouse
data:
  hive-site.xml: |
    <?xml version="1.0"?>
    <configuration>
      <property>
        <name>javax.jdo.option.ConnectionURL</name>
        <value>jdbc:postgresql://postgresql-primary.database:5432/hive_metastore</value>
      </property>
      <property>
        <name>javax.jdo.option.ConnectionDriverName</name>
        <value>org.postgresql.Driver</value>
      </property>
      <property>
        <name>javax.jdo.option.ConnectionUserName</name>
        <value>hive_user</value>
      </property>
      <property>
        <name>javax.jdo.option.ConnectionPassword</name>
        <value>CHANGE_ME_HIVE_PASSWORD</value>
      </property>
      <property>
        <name>hive.metastore.warehouse.dir</name>
        <value>s3a://lakehouse/warehouse</value>
      </property>
      <property>
        <name>fs.s3a.endpoint</name>
        <value>http://rustfs.lakehouse:9000</value>
      </property>
      <property>
        <name>fs.s3a.access.key</name>
        <value>CHANGE_ME_RUSTFS_ACCESS_KEY</value>
      </property>
      <property>
        <name>fs.s3a.secret.key</name>
        <value>CHANGE_ME_RUSTFS_SECRET_KEY</value>
      </property>
      <property>
        <name>fs.s3a.path.style.access</name>
        <value>true</value>
      </property>
      <property>
        <name>fs.s3a.impl</name>
        <value>org.apache.hadoop.fs.s3a.S3AFileSystem</value>
      </property>
      <property>
        <name>hive.metastore.uris</name>
        <value>thrift://hive-metastore:9083</value>
      </property>
    </configuration>

---
# Hive Metastore Deployment (HA)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hive-metastore
  namespace: lakehouse
  labels:
    app: hive-metastore
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hive-metastore
  template:
    metadata:
      labels:
        app: hive-metastore
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - hive-metastore
              topologyKey: kubernetes.io/hostname
      containers:
        - name: hive-metastore
          image: apache/hive:3.1.3
          command:
            - /opt/hive/bin/hive
            - --service
            - metastore
          ports:
            - containerPort: 9083
              name: thrift
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          livenessProbe:
            tcpSocket:
              port: 9083
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 9083
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /opt/hive/conf/hive-site.xml
              subPath: hive-site.xml
      volumes:
        - name: config
          configMap:
            name: hive-metastore-config

---
# Hive Metastore Service
apiVersion: v1
kind: Service
metadata:
  name: hive-metastore
  namespace: lakehouse
spec:
  selector:
    app: hive-metastore
  ports:
    - port: 9083
      targetPort: 9083
      name: thrift
  type: ClusterIP

---
# Trino Coordinator ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-coordinator-config
  namespace: lakehouse
data:
  node.properties: |
    node.environment=production
    node.data-dir=/data/trino
    plugin.dir=/usr/lib/trino/plugin
  
  jvm.config: |
    -server
    -Xmx8G
    -XX:+UseG1GC
    -XX:G1HeapRegionSize=32M
    -XX:+UseGCOverheadLimit
    -XX:+ExplicitGCInvokesConcurrent
    -XX:+HeapDumpOnOutOfMemoryError
    -XX:+ExitOnOutOfMemoryError
    -Djdk.attach.allowAttachSelf=true
    -Djdk.nio.maxCachedBufferSize=2000000
  
  config.properties: |
    coordinator=true
    node-scheduler.include-coordinator=false
    http-server.http.port=8080
    query.max-memory=50GB
    query.max-memory-per-node=8GB
    discovery.uri=http://trino-coordinator:8080
    http-server.authentication.type=PASSWORD
  
  password-authenticator.properties: |
    password-authenticator.name=file
    file.password-file=/etc/trino/password.db
  
  iceberg.properties: |
    connector.name=iceberg
    hive.metastore.uri=thrift://hive-metastore:9083
    iceberg.catalog.type=hive_metastore
    hive.s3.endpoint=http://rustfs.lakehouse:9000
    hive.s3.path-style-access=true
    hive.s3.aws-access-key=CHANGE_ME_RUSTFS_ACCESS_KEY
    hive.s3.aws-secret-key=CHANGE_ME_RUSTFS_SECRET_KEY

---
# Trino Worker ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-worker-config
  namespace: lakehouse
data:
  node.properties: |
    node.environment=production
    node.data-dir=/data/trino
    plugin.dir=/usr/lib/trino/plugin
  
  jvm.config: |
    -server
    -Xmx16G
    -XX:+UseG1GC
    -XX:G1HeapRegionSize=32M
    -XX:+UseGCOverheadLimit
    -XX:+ExplicitGCInvokesConcurrent
    -XX:+HeapDumpOnOutOfMemoryError
    -XX:+ExitOnOutOfMemoryError
    -Djdk.attach.allowAttachSelf=true
    -Djdk.nio.maxCachedBufferSize=2000000
  
  config.properties: |
    coordinator=false
    http-server.http.port=8080
    query.max-memory=50GB
    query.max-memory-per-node=16GB
    discovery.uri=http://trino-coordinator:8080
  
  iceberg.properties: |
    connector.name=iceberg
    hive.metastore.uri=thrift://hive-metastore:9083
    iceberg.catalog.type=hive_metastore
    hive.s3.endpoint=http://rustfs.lakehouse:9000
    hive.s3.path-style-access=true
    hive.s3.aws-access-key=CHANGE_ME_RUSTFS_ACCESS_KEY
    hive.s3.aws-secret-key=CHANGE_ME_RUSTFS_SECRET_KEY

---
# Trino Coordinator Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trino-coordinator
  namespace: lakehouse
  labels:
    app: trino
    component: coordinator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: trino
      component: coordinator
  template:
    metadata:
      labels:
        app: trino
        component: coordinator
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: component
                    operator: In
                    values:
                      - coordinator
              topologyKey: kubernetes.io/hostname
      containers:
        - name: trino
          image: trinodb/trino:433
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 2000m
              memory: 8Gi
            limits:
              cpu: 8000m
              memory: 16Gi
          livenessProbe:
            httpGet:
              path: /v1/info
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /v1/info
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/trino
            - name: catalog
              mountPath: /etc/trino/catalog
      volumes:
        - name: config
          configMap:
            name: trino-coordinator-config
        - name: catalog
          configMap:
            name: trino-coordinator-config
            items:
              - key: iceberg.properties
                path: iceberg.properties

---
# Trino Worker StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: trino-worker
  namespace: lakehouse
  labels:
    app: trino
    component: worker
spec:
  serviceName: trino-worker-headless
  replicas: 5
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: trino
      component: worker
  template:
    metadata:
      labels:
        app: trino
        component: worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: component
                      operator: In
                      values:
                        - worker
                topologyKey: kubernetes.io/hostname
      containers:
        - name: trino
          image: trinodb/trino:433
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 4000m
              memory: 16Gi
            limits:
              cpu: 16000m
              memory: 32Gi
          livenessProbe:
            httpGet:
              path: /v1/info
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /v1/info
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/trino
            - name: catalog
              mountPath: /etc/trino/catalog
            - name: data
              mountPath: /data/trino
      volumes:
        - name: config
          configMap:
            name: trino-worker-config
        - name: catalog
          configMap:
            name: trino-worker-config
            items:
              - key: iceberg.properties
                path: iceberg.properties
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: fast-ssd
        resources:
          requests:
            storage: 100Gi

---
# Trino Coordinator Service
apiVersion: v1
kind: Service
metadata:
  name: trino-coordinator
  namespace: lakehouse
spec:
  selector:
    app: trino
    component: coordinator
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  type: ClusterIP

---
# Trino Worker Headless Service
apiVersion: v1
kind: Service
metadata:
  name: trino-worker-headless
  namespace: lakehouse
spec:
  clusterIP: None
  selector:
    app: trino
    component: worker
  ports:
    - port: 8080
      targetPort: 8080
      name: http

---
# PodDisruptionBudget for RustFS
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rustfs-pdb
  namespace: lakehouse
spec:
  minAvailable: 3
  selector:
    matchLabels:
      app: rustfs

---
# PodDisruptionBudget for Trino Workers
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: trino-worker-pdb
  namespace: lakehouse
spec:
  minAvailable: 3
  selector:
    matchLabels:
      app: trino
      component: worker

---
# HorizontalPodAutoscaler for Trino Workers
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: trino-worker-hpa
  namespace: lakehouse
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: trino-worker
  minReplicas: 5
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
# ServiceMonitor for Prometheus
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: lakehouse-monitor
  namespace: lakehouse
  labels:
    prometheus: kube-prometheus
spec:
  selector:
    matchLabels:
      app: trino
  endpoints:
    - port: http
      interval: 30s
      path: /v1/info
