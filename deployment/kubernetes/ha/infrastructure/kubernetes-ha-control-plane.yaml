---
# Kubernetes High Availability Control Plane Configuration
# Production-ready multi-master Kubernetes cluster setup
# Version: 1.0.0

# This configuration provides HA setup for Kubernetes control plane components
# Designed for kubeadm-based clusters with external etcd

apiVersion: v1
kind: Namespace
metadata:
  name: kube-system
  labels:
    name: kube-system

---
# Kubeadm ClusterConfiguration for HA
apiVersion: kubeadm.k8s.io/v1beta3
kind: ClusterConfiguration
metadata:
  name: kubernetes-ha-config
kubernetesVersion: v1.28.0
controlPlaneEndpoint: "k8s-api.neobank.internal:6443"
networking:
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/12"
  dnsDomain: "cluster.local"
apiServer:
  certSANs:
    - "k8s-api.neobank.internal"
    - "10.0.0.10"
    - "10.0.0.11"
    - "10.0.0.12"
    - "127.0.0.1"
  extraArgs:
    audit-log-path: "/var/log/kubernetes/audit.log"
    audit-log-maxage: "30"
    audit-log-maxbackup: "10"
    audit-log-maxsize: "100"
    enable-admission-plugins: "NodeRestriction,PodSecurityPolicy,ServiceAccount"
    encryption-provider-config: "/etc/kubernetes/encryption-config.yaml"
    event-ttl: "1h"
    max-requests-inflight: "1000"
    max-mutating-requests-inflight: "500"
    profiling: "false"
    request-timeout: "300s"
    service-account-lookup: "true"
    tls-cipher-suites: "TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305,TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384"
  extraVolumes:
    - name: audit-log
      hostPath: /var/log/kubernetes
      mountPath: /var/log/kubernetes
      pathType: DirectoryOrCreate
    - name: encryption-config
      hostPath: /etc/kubernetes/encryption-config.yaml
      mountPath: /etc/kubernetes/encryption-config.yaml
      readOnly: true
      pathType: File
controllerManager:
  extraArgs:
    bind-address: "0.0.0.0"
    profiling: "false"
    terminated-pod-gc-threshold: "100"
    use-service-account-credentials: "true"
    feature-gates: "RotateKubeletServerCertificate=true"
scheduler:
  extraArgs:
    bind-address: "0.0.0.0"
    profiling: "false"
etcd:
  external:
    endpoints:
      - "https://etcd-0.etcd.kube-system.svc.cluster.local:2379"
      - "https://etcd-1.etcd.kube-system.svc.cluster.local:2379"
      - "https://etcd-2.etcd.kube-system.svc.cluster.local:2379"
    caFile: /etc/kubernetes/pki/etcd/ca.crt
    certFile: /etc/kubernetes/pki/apiserver-etcd-client.crt
    keyFile: /etc/kubernetes/pki/apiserver-etcd-client.key

---
# External etcd StatefulSet for HA
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: etcd
  namespace: kube-system
  labels:
    app: etcd
spec:
  serviceName: etcd
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: etcd
  template:
    metadata:
      labels:
        app: etcd
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - etcd
              topologyKey: kubernetes.io/hostname
      containers:
        - name: etcd
          image: registry.k8s.io/etcd:3.5.10-0
          ports:
            - containerPort: 2379
              name: client
            - containerPort: 2380
              name: peer
          env:
            - name: ETCD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: ETCD_DATA_DIR
              value: /var/lib/etcd
            - name: ETCD_INITIAL_ADVERTISE_PEER_URLS
              value: https://$(ETCD_NAME).etcd.kube-system.svc.cluster.local:2380
            - name: ETCD_LISTEN_PEER_URLS
              value: https://0.0.0.0:2380
            - name: ETCD_LISTEN_CLIENT_URLS
              value: https://0.0.0.0:2379
            - name: ETCD_ADVERTISE_CLIENT_URLS
              value: https://$(ETCD_NAME).etcd.kube-system.svc.cluster.local:2379
            - name: ETCD_INITIAL_CLUSTER
              value: etcd-0=https://etcd-0.etcd.kube-system.svc.cluster.local:2380,etcd-1=https://etcd-1.etcd.kube-system.svc.cluster.local:2380,etcd-2=https://etcd-2.etcd.kube-system.svc.cluster.local:2380
            - name: ETCD_INITIAL_CLUSTER_STATE
              value: new
            - name: ETCD_INITIAL_CLUSTER_TOKEN
              value: k8s-etcd-cluster
            - name: ETCD_CERT_FILE
              value: /etc/kubernetes/pki/etcd/server.crt
            - name: ETCD_KEY_FILE
              value: /etc/kubernetes/pki/etcd/server.key
            - name: ETCD_TRUSTED_CA_FILE
              value: /etc/kubernetes/pki/etcd/ca.crt
            - name: ETCD_CLIENT_CERT_AUTH
              value: "true"
            - name: ETCD_PEER_CERT_FILE
              value: /etc/kubernetes/pki/etcd/peer.crt
            - name: ETCD_PEER_KEY_FILE
              value: /etc/kubernetes/pki/etcd/peer.key
            - name: ETCD_PEER_TRUSTED_CA_FILE
              value: /etc/kubernetes/pki/etcd/ca.crt
            - name: ETCD_PEER_CLIENT_CERT_AUTH
              value: "true"
            - name: ETCD_SNAPSHOT_COUNT
              value: "10000"
            - name: ETCD_HEARTBEAT_INTERVAL
              value: "100"
            - name: ETCD_ELECTION_TIMEOUT
              value: "1000"
            - name: ETCD_MAX_SNAPSHOTS
              value: "5"
            - name: ETCD_MAX_WALS
              value: "5"
            - name: ETCD_QUOTA_BACKEND_BYTES
              value: "8589934592"
            - name: ETCD_AUTO_COMPACTION_RETENTION
              value: "8"
            - name: ETCD_AUTO_COMPACTION_MODE
              value: "periodic"
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - ETCDCTL_API=3 etcdctl --endpoints=https://127.0.0.1:2379 --cacert=/etc/kubernetes/pki/etcd/ca.crt --cert=/etc/kubernetes/pki/etcd/healthcheck-client.crt --key=/etc/kubernetes/pki/etcd/healthcheck-client.key endpoint health
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 15
            failureThreshold: 8
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - ETCDCTL_API=3 etcdctl --endpoints=https://127.0.0.1:2379 --cacert=/etc/kubernetes/pki/etcd/ca.crt --cert=/etc/kubernetes/pki/etcd/healthcheck-client.crt --key=/etc/kubernetes/pki/etcd/healthcheck-client.key endpoint health
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/etcd
            - name: certs
              mountPath: /etc/kubernetes/pki/etcd
              readOnly: true
      volumes:
        - name: certs
          secret:
            secretName: etcd-certs
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: fast-ssd
        resources:
          requests:
            storage: 50Gi

---
# etcd Service
apiVersion: v1
kind: Service
metadata:
  name: etcd
  namespace: kube-system
spec:
  clusterIP: None
  selector:
    app: etcd
  ports:
    - port: 2379
      targetPort: 2379
      name: client
    - port: 2380
      targetPort: 2380
      name: peer

---
# HAProxy Load Balancer for API Server
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: haproxy-apiserver-lb
  namespace: kube-system
  labels:
    app: haproxy-apiserver-lb
spec:
  selector:
    matchLabels:
      app: haproxy-apiserver-lb
  template:
    metadata:
      labels:
        app: haproxy-apiserver-lb
    spec:
      hostNetwork: true
      tolerations:
        - key: node-role.kubernetes.io/master
          effect: NoSchedule
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      containers:
        - name: haproxy
          image: haproxy:2.8-alpine
          ports:
            - containerPort: 6443
              hostPort: 6443
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8404
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /usr/local/etc/haproxy/haproxy.cfg
              subPath: haproxy.cfg
      volumes:
        - name: config
          configMap:
            name: haproxy-config

---
# HAProxy ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: haproxy-config
  namespace: kube-system
data:
  haproxy.cfg: |
    global
        log stdout format raw local0
        maxconn 4096
        ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
        ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    
    defaults
        log global
        mode tcp
        option tcplog
        option dontlognull
        timeout connect 5s
        timeout client 30s
        timeout server 30s
        retries 3
    
    frontend stats
        bind *:8404
        mode http
        stats enable
        stats uri /stats
        stats refresh 10s
        http-request use-service prometheus-exporter if { path /metrics }
        monitor-uri /healthz
    
    frontend k8s-api
        bind *:6443
        mode tcp
        option tcplog
        default_backend k8s-api-servers
    
    backend k8s-api-servers
        mode tcp
        balance roundrobin
        option tcp-check
        default-server inter 10s downinter 5s rise 2 fall 2 slowstart 60s maxconn 250 maxqueue 256 weight 100
        server master-0 10.0.0.10:6443 check
        server master-1 10.0.0.11:6443 check
        server master-2 10.0.0.12:6443 check

---
# PodDisruptionBudget for etcd
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: etcd-pdb
  namespace: kube-system
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: etcd

---
# Encryption Configuration Secret
apiVersion: v1
kind: Secret
metadata:
  name: encryption-config
  namespace: kube-system
type: Opaque
stringData:
  encryption-config.yaml: |
    apiVersion: apiserver.config.k8s.io/v1
    kind: EncryptionConfiguration
    resources:
      - resources:
          - secrets
        providers:
          - aescbc:
              keys:
                - name: key1
                  secret: CHANGE_ME_BASE64_ENCODED_32_BYTE_KEY
          - identity: {}

---
# Audit Policy ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: audit-policy
  namespace: kube-system
data:
  audit-policy.yaml: |
    apiVersion: audit.k8s.io/v1
    kind: Policy
    rules:
      # Don't log requests to certain non-resource URL paths
      - level: None
        nonResourceURLs:
          - /healthz*
          - /version
          - /swagger*
          - /metrics
      
      # Don't log watch requests
      - level: None
        verbs:
          - watch
      
      # Don't log kube-system service account token requests
      - level: None
        users:
          - system:kube-controller-manager
          - system:kube-scheduler
          - system:serviceaccount:kube-system:*
        verbs:
          - get
          - list
      
      # Log secrets at Metadata level
      - level: Metadata
        resources:
          - group: ""
            resources:
              - secrets
              - configmaps
      
      # Log pod changes at RequestResponse level
      - level: RequestResponse
        resources:
          - group: ""
            resources:
              - pods
              - pods/log
              - pods/status
        verbs:
          - create
          - update
          - patch
          - delete
      
      # Log everything else at Metadata level
      - level: Metadata
        omitStages:
          - RequestReceived

---
# CoreDNS HA Configuration
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coredns
  namespace: kube-system
  labels:
    k8s-app: kube-dns
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      k8s-app: kube-dns
  template:
    metadata:
      labels:
        k8s-app: kube-dns
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: k8s-app
                      operator: In
                      values:
                        - kube-dns
                topologyKey: kubernetes.io/hostname
      priorityClassName: system-cluster-critical
      serviceAccountName: coredns
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists
        - key: node-role.kubernetes.io/master
          effect: NoSchedule
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
      containers:
        - name: coredns
          image: registry.k8s.io/coredns/coredns:v1.11.1
          args:
            - -conf
            - /etc/coredns/Corefile
          ports:
            - containerPort: 53
              name: dns
              protocol: UDP
            - containerPort: 53
              name: dns-tcp
              protocol: TCP
            - containerPort: 9153
              name: metrics
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 70Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 60
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: 8181
              scheme: HTTP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - NET_BIND_SERVICE
              drop:
                - all
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config-volume
              mountPath: /etc/coredns
              readOnly: true
      dnsPolicy: Default
      volumes:
        - name: config-volume
          configMap:
            name: coredns
            items:
              - key: Corefile
                path: Corefile

---
# PodDisruptionBudget for CoreDNS
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: coredns-pdb
  namespace: kube-system
spec:
  minAvailable: 2
  selector:
    matchLabels:
      k8s-app: kube-dns

---
# ServiceMonitor for etcd
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: etcd-monitor
  namespace: kube-system
  labels:
    prometheus: kube-prometheus
spec:
  selector:
    matchLabels:
      app: etcd
  endpoints:
    - port: client
      interval: 30s
      scheme: https
      tlsConfig:
        caFile: /etc/prometheus/secrets/etcd-certs/ca.crt
        certFile: /etc/prometheus/secrets/etcd-certs/healthcheck-client.crt
        keyFile: /etc/prometheus/secrets/etcd-certs/healthcheck-client.key
