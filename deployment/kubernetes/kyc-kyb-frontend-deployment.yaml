---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kyc-kyb-frontend-config
  labels:
    app: kyc-kyb-frontend
    tier: frontend
data:
  API_BASE_URL: "http://kyc-kyb-backend-service:8080/api/v1"
  FEATURE_TOGGLE_A: "true"
---
apiVersion: v1
kind: Service
metadata:
  name: kyc-kyb-frontend-service
  labels:
    app: kyc-kyb-frontend
    tier: frontend
spec:
  type: ClusterIP
  selector:
    app: kyc-kyb-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kyc-kyb-frontend-deployment
  labels:
    app: kyc-kyb-frontend
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kyc-kyb-frontend
  template:
    metadata:
      labels:
        app: kyc-kyb-frontend
        tier: frontend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        fluentd.io/log-path: "/var/log/nginx/access.log"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: kyc-kyb-frontend
          image: your-registry/kyc-kyb-frontend:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: kyc-kyb-frontend-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 1
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
      serviceAccountName: kyc-kyb-frontend-sa
