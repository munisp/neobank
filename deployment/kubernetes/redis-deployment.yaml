apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: redis-prod
type: Opaque
data:
  # CHANGE_ME: Replace with base64-encoded production password
  # echo -n 'YOUR_SECURE_PASSWORD' | base64
  redis-password: Q0hBTkdFX01FX1JFRElTX1BBU1NXT1JE

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: redis-prod
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: redis-prod
  annotations:
    # Example annotations for monitoring and logging
    prometheus.io/scrape: "true"
    prometheus.io/port: "9121" # Assuming a sidecar exporter or similar
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
      name: redis
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: redis-prod

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-deployment
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: redis-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/instance: redis-prod
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/instance: redis-prod
      annotations:
        # Example annotation for logging configuration
        log-config/level: "info"
    spec:
      securityContext:
        # Best practice: Run as non-root user (e.g., UID 1000 for official Redis image)
        runAsUser: 1000
        fsGroup: 1000
        runAsNonRoot: true
      containers:
        - name: redis
          image: redis:7.2-alpine # A stable, lightweight, and secure image
          imagePullPolicy: IfNotPresent
          command: ["redis-server"]
          args:
            - "--requirepass"
            - "$(REDIS_PASSWORD)"
            - "--appendonly"
            - "yes"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: redis-password
          ports:
            - containerPort: 6379
              name: redis
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "250m"
              memory: "256Mi"
          volumeMounts:
            - name: redis-data
              mountPath: /data
          # Liveness Probe: Check if the Redis process is running and responsive
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - 'redis-cli -a $REDIS_PASSWORD ping'
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          # Readiness Probe: Check if Redis is ready to accept connections
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - 'redis-cli -a $REDIS_PASSWORD ping'
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            # Best practice: Read-only root filesystem where possible
            readOnlyRootFilesystem: true
            # Drop unnecessary capabilities
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - SETGID
                - SETUID
                - DAC_OVERRIDE
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-pvc
