apiVersion: v1
kind: ConfigMap
metadata:
  name: pwa-config
  labels:
    app.kubernetes.io/name: pwa
    app.kubernetes.io/instance: pwa-prod
data:
  # Assuming the PWA needs some environment configuration
  API_BASE_URL: "https://api.example.com/v1"
  FEATURE_TOGGLE_A: "true"
  LOG_LEVEL: "info"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pwa-deployment
  labels:
    app.kubernetes.io/name: pwa
    app.kubernetes.io/instance: pwa-prod
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: application
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/instance: pwa-prod
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pwa
        app.kubernetes.io/instance: pwa-prod
        app.kubernetes.io/component: frontend
      annotations:
        # Example annotations for monitoring (Prometheus) and logging (Fluentd/Loki)
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        log.io/enabled: "true"
    spec:
      # Security Context for the Pod
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001 # A non-root user ID
        fsGroup: 10001
      containers:
      - name: pwa-container
        image: nginx:stable-alpine # Placeholder image for a PWA
        ports:
        - containerPort: 8080 # Assuming the PWA serves on 8080
        resources:
          limits:
            cpu: "250m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
        # Health Checks
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 1
        # Security Context for the Container
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true # Read-only filesystem where possible
        # ConfigMap integration (mounted as a volume)
        volumeMounts:
        - name: config-volume
          mountPath: /etc/pwa-config
          readOnly: true
      volumes:
      - name: config-volume
        configMap:
          name: pwa-config
---
apiVersion: v1
kind: Service
metadata:
  name: pwa-service
  labels:
    app.kubernetes.io/name: pwa
    app.kubernetes.io/instance: pwa-prod
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: pwa-prod
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080 # Target the container port defined in the Deployment
      name: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pwa-hpa
  labels:
    app.kubernetes.io/name: pwa
    app.kubernetes.io/instance: pwa-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pwa-deployment
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80 # Target 80% CPU utilization