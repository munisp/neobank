apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-web-config
  labels:
    app.kubernetes.io/name: frontend-web
    app.kubernetes.io/instance: frontend-web-prod
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: web-app
data:
  # Placeholder for frontend configuration, e.g., API endpoint URL
  CONFIG_ENV: "production"
  API_URL: "http://backend-api-service:8080/api/v1"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-web-deployment
  labels:
    app.kubernetes.io/name: frontend-web
    app.kubernetes.io/instance: frontend-web-prod
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: web-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend-web
      app.kubernetes.io/instance: frontend-web-prod
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend-web
        app.kubernetes.io/instance: frontend-web-prod
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: web-app
      annotations:
        # Placeholder annotations for monitoring/logging
        prometheus.io/scrape: "true"
        prometheus.io/port: "80"
        log-level: "info"
    spec:
      # Security Context for the Pod
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001 # A non-root user ID
        fsGroup: 10001
      containers:
      - name: frontend-web
        # Placeholder image - replace with actual frontend image (e.g., a static site served by nginx)
        image: "nginx:stable-alpine"
        ports:
        - containerPort: 80
        envFrom:
        - configMapRef:
            name: frontend-web-config
        resources:
          limits:
            cpu: "250m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
        # Health Checks
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        # Security Context for the Container
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true # Enforce read-only filesystem
          capabilities:
            drop:
            - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-web-service
  labels:
    app.kubernetes.io/name: frontend-web
    app.kubernetes.io/instance: frontend-web-prod
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: web-app
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app.kubernetes.io/name: frontend-web
    app.kubernetes.io/instance: frontend-web-prod
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend-web-hpa
  labels:
    app.kubernetes.io/name: frontend-web
    app.kubernetes.io/instance: frontend-web-prod
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: web-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend-web-deployment
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80 # Target 80% CPU utilization
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80 # Target 80% memory utilization