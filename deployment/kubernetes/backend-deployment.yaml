apiVersion: apps/v1
kind: Deployment
metadata:
  name: neobank-backend
  namespace: neobank
  labels:
    app: neobank-backend
    version: v6.0
spec:
  replicas: 3
  selector:
    matchLabels:
      app: neobank-backend
  template:
    metadata:
      labels:
        app: neobank-backend
        version: v6.0
    spec:
      containers:
      - name: backend
        image: neobank/backend:v6.0
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: neobank-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: neobank-secrets
              key: redis-url
        - name: KAFKA_BROKERS
          value: "kafka:9092"
        - name: TIGERBEETLE_ADDRESSES
          value: "tigerbeetle:3000"
        - name: TEMPORAL_HOST
          value: "temporal:7233"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: neobank-backend
  namespace: neobank
spec:
  selector:
    app: neobank-backend
  ports:
  - port: 8000
    targetPort: 8000
    name: http
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: neobank-backend-hpa
  namespace: neobank
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: neobank-backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
