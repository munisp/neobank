[package]
name = "neobank-rustfs-client"
version = "1.0.0"
edition = "2021"
authors = ["NeoBank Team"]
description = "High-performance RustFS/S3 client for NeoBank lakehouse operations"
license = "Apache-2.0"

[dependencies]
# AWS S3 SDK
aws-config = "1.1"
aws-sdk-s3 = "1.12"
aws-credential-types = "1.1"
aws-smithy-runtime-api = "1.1"

# Async runtime
tokio = { version = "1.35", features = ["full", "rt-multi-thread", "macros"] }

# HTTP client
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Metrics
prometheus = "0.13"

# Configuration
config = "0.14"
dotenv = "0.15"

# UUID generation
uuid = { version = "1.6", features = ["v4", "serde"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Async traits
async-trait = "0.1"

# Bytes handling
bytes = "1.5"

# Futures
futures = "0.3"

# HTTP server for health checks and metrics
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Retry logic
backoff = { version = "0.4", features = ["tokio"] }

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.12"
criterion = "0.5"
tempfile = "3.9"

[[bin]]
name = "neobank-rustfs-client"
path = "src/main.rs"

[[bench]]
name = "s3_benchmarks"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
