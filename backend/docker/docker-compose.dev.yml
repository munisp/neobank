version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: neobank_postgres_dev
    environment:
      POSTGRES_DB: neobank_development
      POSTGRES_USER: neobank
      POSTGRES_PASSWORD: secure_password_123
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neobank -d neobank_development"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - neobank_network

  redis:
    image: redis:7-alpine
    container_name: neobank_redis_dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass redis_password_123
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - neobank_network

  tigerbeetle:
    image: tigerbeetle/tigerbeetle:latest
    container_name: neobank_tigerbeetle_dev
    ports:
      - "8001:8001"
    volumes:
      - tigerbeetle_data:/data
    command: start --addresses=0.0.0.0:8001 /data/cluster_0.tigerbeetle
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - neobank_network

  prometheus:
    image: prom/prometheus:latest
    container_name: neobank_prometheus_dev
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - neobank_network

  grafana:
    image: grafana/grafana:latest
    container_name: neobank_grafana_dev
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_USERS_ALLOW_SIGN_UP: false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - neobank_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  tigerbeetle_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  neobank_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
