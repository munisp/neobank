apisix:
  # Enable APISIX
  enable: true

  # Upstream configuration for NeoBank backend
  upstreams:
    - name: neobank_backend
      nodes:
        "neobank-backend:8000": 1
    - name: mojaloop_hub
      nodes:
        "mojaloop-ml-api-adapter:4000": 1
    - name: mojaloop_als
      nodes:
        "mojaloop-account-lookup-service:4002": 1

  # Routes configuration
  routes:
    # Authentication endpoints
    - uri: /api/auth/*
      upstream_id: neobank_backend
      plugins:
        # Rate limiting for authentication
        limit-conn:
          conn: 10
          burst: 5
          default_conn_delay: 0.1
        # JWT authentication
        jwt-auth:
          key: "${JWT_SECRET_KEY}"

    # Transaction endpoints
    - uri: /api/transactions/*
      upstream_id: neobank_backend
      plugins:
        # Rate limiting for transactions
        limit-req:
          rate: 100
          burst: 50
          key: "remote_addr"
        # OPA policy enforcement
        opa:
          host: "http://opa:8181"
          policy: "neobank/transactions"

    # KYC endpoints
    - uri: /api/kyc/*
      upstream_id: neobank_backend
      plugins:
        # Rate limiting for KYC
        limit-req:
          rate: 20
          burst: 10
          key: "remote_addr"

    # ==================== Mojaloop FSPIOP API Routes ====================
    
    # Party Lookup (Account Lookup Service)
    - uri: /parties/*
      upstream_id: mojaloop_als
      plugins:
        # Keycloak authentication for DFSP access
        authz-keycloak:
          token_endpoint: "${KEYCLOAK_URL}/realms/neobank/protocol/openid-connect/token"
          client_id: "mojaloop-dfsp"
          client_secret: "${KEYCLOAK_MOJALOOP_SECRET}"
          grant_type: "client_credentials"
          ssl_verify: false
        # Rate limiting for party lookups
        limit-req:
          rate: 200
          burst: 100
          key: "remote_addr"
        # Request ID for tracing
        request-id:
          header_name: "X-Request-ID"
          include_in_response: true
        # OpenTelemetry tracing
        opentelemetry:
          sampler:
            name: "always_on"

    # Quotes API
    - uri: /quotes/*
      upstream_id: mojaloop_hub
      plugins:
        authz-keycloak:
          token_endpoint: "${KEYCLOAK_URL}/realms/neobank/protocol/openid-connect/token"
          client_id: "mojaloop-dfsp"
          client_secret: "${KEYCLOAK_MOJALOOP_SECRET}"
          grant_type: "client_credentials"
          ssl_verify: false
        limit-req:
          rate: 100
          burst: 50
          key: "remote_addr"
        request-id:
          header_name: "X-Request-ID"
          include_in_response: true
        opentelemetry:
          sampler:
            name: "always_on"

    # Transfers API
    - uri: /transfers/*
      upstream_id: mojaloop_hub
      plugins:
        authz-keycloak:
          token_endpoint: "${KEYCLOAK_URL}/realms/neobank/protocol/openid-connect/token"
          client_id: "mojaloop-dfsp"
          client_secret: "${KEYCLOAK_MOJALOOP_SECRET}"
          grant_type: "client_credentials"
          ssl_verify: false
        # Stricter rate limiting for transfers
        limit-req:
          rate: 50
          burst: 25
          key: "remote_addr"
        # OPA policy for transfer authorization
        opa:
          host: "http://opa:8181"
          policy: "neobank/mojaloop/transfers"
        request-id:
          header_name: "X-Request-ID"
          include_in_response: true
        opentelemetry:
          sampler:
            name: "always_on"

    # Bulk Transfers API
    - uri: /bulkTransfers/*
      upstream_id: mojaloop_hub
      plugins:
        authz-keycloak:
          token_endpoint: "${KEYCLOAK_URL}/realms/neobank/protocol/openid-connect/token"
          client_id: "mojaloop-dfsp"
          client_secret: "${KEYCLOAK_MOJALOOP_SECRET}"
          grant_type: "client_credentials"
          ssl_verify: false
        limit-req:
          rate: 20
          burst: 10
          key: "remote_addr"
        request-id:
          header_name: "X-Request-ID"
          include_in_response: true

    # Transaction Requests API
    - uri: /transactionRequests/*
      upstream_id: mojaloop_hub
      plugins:
        authz-keycloak:
          token_endpoint: "${KEYCLOAK_URL}/realms/neobank/protocol/openid-connect/token"
          client_id: "mojaloop-dfsp"
          client_secret: "${KEYCLOAK_MOJALOOP_SECRET}"
          grant_type: "client_credentials"
          ssl_verify: false
        limit-req:
          rate: 100
          burst: 50
          key: "remote_addr"
        request-id:
          header_name: "X-Request-ID"
          include_in_response: true

    # Mojaloop DFSP Adapter (internal NeoBank endpoints)
    - uri: /api/mojaloop/*
      upstream_id: neobank_backend
      plugins:
        jwt-auth:
          key: "${JWT_SECRET_KEY}"
        limit-req:
          rate: 100
          burst: 50
          key: "remote_addr"
        opa:
          host: "http://opa:8181"
          policy: "neobank/mojaloop"

    # ==================== Connectivity Service Routes ====================
    
    # Power Management - Battery-aware sync policies
    - uri: /api/v1/connectivity/power/*
      upstream_id: neobank_backend
      plugins:
        # Adaptive compression based on connection type
        gzip:
          min_length: 1024
          types:
            - "application/json"
        # Caching for sync policies
        proxy-cache:
          cache_key:
            - "$uri"
            - "$arg_device_id"
          cache_ttl: 60
        # Rate limiting
        limit-req:
          rate: 100
          burst: 50
          key: "remote_addr"

    # Adaptive Data - Network quality based optimization
    - uri: /api/v1/connectivity/adaptive/*
      upstream_id: neobank_backend
      plugins:
        gzip:
          min_length: 512
          types:
            - "application/json"
        proxy-cache:
          cache_key:
            - "$uri"
            - "$arg_device_id"
          cache_ttl: 30
        limit-req:
          rate: 200
          burst: 100
          key: "remote_addr"

    # Offline Transactions - Extended offline support (72 hours)
    - uri: /api/v1/connectivity/offline/*
      upstream_id: neobank_backend
      plugins:
        # No caching for offline transactions
        jwt-auth:
          key: "${JWT_SECRET_KEY}"
        # OPA policy for offline transaction limits
        opa:
          host: "http://opa:8181"
          policy: "neobank/offline_transactions"
        limit-req:
          rate: 50
          burst: 25
          key: "remote_addr"
        # Request ID for tracing
        request-id:
          header_name: "X-Request-ID"
          include_in_response: true

    # Conflict Resolution
    - uri: /api/v1/connectivity/conflicts/*
      upstream_id: neobank_backend
      plugins:
        jwt-auth:
          key: "${JWT_SECRET_KEY}"
        limit-req:
          rate: 50
          burst: 25
          key: "remote_addr"

    # Data Saver Settings
    - uri: /api/v1/connectivity/datasaver/*
      upstream_id: neobank_backend
      plugins:
        jwt-auth:
          key: "${JWT_SECRET_KEY}"
        proxy-cache:
          cache_key:
            - "$uri"
          cache_ttl: 300
        limit-req:
          rate: 100
          burst: 50
          key: "remote_addr"

    # Progressive Loading - Skeleton data and loading plans
    - uri: /api/v1/connectivity/loading/*
      upstream_id: neobank_backend
      plugins:
        gzip:
          min_length: 256
          types:
            - "application/json"
        proxy-cache:
          cache_key:
            - "$uri"
            - "$arg_screen_type"
          cache_ttl: 3600
        limit-req:
          rate: 500
          burst: 200
          key: "remote_addr"

    # Default route for all other endpoints
    - uri: /*
      upstream_id: neobank_backend

